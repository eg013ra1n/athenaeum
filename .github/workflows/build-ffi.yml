name: Build with FFI

on:
  push:
    branches: [main, export]
    paths:
      - 'src-tauri/**'
      - 'src/stacking/**'
      - '.github/workflows/build-ffi.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/stacking/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build without FFI - quick sanity check
  build-no-ffi:
    runs-on: ubuntu-latest
    name: Build (no FFI)
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-no-ffi-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies for Tauri
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build
        run: |
          cd src-tauri
          cargo build

      - name: Run tests
        run: |
          cd src-tauri
          cargo test --lib -- --test-threads=1

  # macOS with FFI
  build-macos:
    runs-on: macos-14  # Apple Silicon
    name: Build (macOS FFI)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install dependencies
        run: brew install cfitsio gsl wcslib fftw lcms2 meson ninja

      - name: Cache Siril build
        uses: actions/cache@v4
        with:
          path: src/stacking/build
          key: siril-macos-${{ hashFiles('src/stacking/src/**/*.c', 'src/stacking/src/**/*.h', 'src/stacking/meson.build') }}

      - name: Build Siril static library
        run: |
          cd src/stacking
          if [ ! -f build/src/libsiril.a ]; then
            meson setup build --default-library=static -Denable-gui=false --buildtype=release || true
            if [ -d build ]; then
              meson compile -C build || echo "Siril build failed - will test without FFI"
            fi
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-ffi-${{ hashFiles('**/Cargo.lock') }}

      - name: Build with FFI
        env:
          SIRIL_LIB_DIR: ${{ github.workspace }}/src/stacking/build/src
        run: |
          cd src-tauri
          if [ -f "$SIRIL_LIB_DIR/libsiril.a" ]; then
            cargo build --features siril-ffi
          else
            echo "Siril library not found, building without FFI"
            cargo build
          fi

      - name: Run tests
        env:
          SIRIL_LIB_DIR: ${{ github.workspace }}/src/stacking/build/src
        run: |
          cd src-tauri
          if [ -f "$SIRIL_LIB_DIR/libsiril.a" ]; then
            cargo test --features siril-ffi -- --test-threads=1
          else
            cargo test -- --test-threads=1
          fi

  # Linux with FFI
  build-linux:
    runs-on: ubuntu-latest
    name: Build (Linux FFI)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libcfitsio-dev libgsl-dev wcslib-dev \
              libfftw3-dev liblcms2-dev meson ninja-build \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache Siril build
        uses: actions/cache@v4
        with:
          path: src/stacking/build
          key: siril-linux-${{ hashFiles('src/stacking/src/**/*.c', 'src/stacking/src/**/*.h', 'src/stacking/meson.build') }}

      - name: Build Siril static library
        run: |
          cd src/stacking
          if [ ! -f build/src/libsiril.a ]; then
            meson setup build --default-library=static -Denable-gui=false --buildtype=release || true
            if [ -d build ]; then
              meson compile -C build || echo "Siril build failed - will test without FFI"
            fi
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-ffi-${{ hashFiles('**/Cargo.lock') }}

      - name: Build with FFI
        env:
          SIRIL_LIB_DIR: ${{ github.workspace }}/src/stacking/build/src
        run: |
          cd src-tauri
          if [ -f "$SIRIL_LIB_DIR/libsiril.a" ]; then
            cargo build --features siril-ffi
          else
            echo "Siril library not found, building without FFI"
            cargo build
          fi

      - name: Run tests
        env:
          SIRIL_LIB_DIR: ${{ github.workspace }}/src/stacking/build/src
        run: |
          cd src-tauri
          if [ -f "$SIRIL_LIB_DIR/libsiril.a" ]; then
            cargo test --features siril-ffi -- --test-threads=1
          else
            cargo test -- --test-threads=1
          fi

  # Windows with FFI (uses vcpkg)
  build-windows:
    runs-on: windows-latest
    name: Build (Windows FFI)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '501db0f17ef6df184fcdbfbe0f87cde2313b6ab1'
          vcpkgJsonGlob: 'src-tauri/vcpkg.json'

      - name: Install vcpkg dependencies
        run: |
          vcpkg install cfitsio:x64-windows-static-md
          vcpkg install fftw3:x64-windows-static-md
          vcpkg install gsl:x64-windows-static-md
          vcpkg install lcms2:x64-windows-static-md

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-ffi-${{ hashFiles('**/Cargo.lock') }}

      # Windows FFI build is complex - just verify non-FFI builds for now
      - name: Build (without FFI for now)
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          cd src-tauri
          cargo build

      - name: Run tests
        run: |
          cd src-tauri
          cargo test -- --test-threads=1
