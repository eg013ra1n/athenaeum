name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Tauri 2 Linux prerequisites. The GitLab runners have these provisioned
      # on the host, so this list is the only place in the repository where the
      # dependency set is written down.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file

      # No toolchain version appears here on purpose: rustup reads
      # rust-toolchain.toml and installs what it pins, so CI can never drift
      # from the workspace. `rustup show` is what triggers that install.
      - name: Resolve the pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build workspace
        run: cargo build --workspace

      - name: Test core
        run: cargo test -p athenaeum-core

      - name: Typecheck frontend
        run: npx tsc --noEmit
