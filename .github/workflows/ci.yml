name: CI

on:
  # Documentation-only changes cannot break the build, and a cold run costs
  # over twenty minutes of runner time.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  # Tags too: the GitLab tag pipeline builds and publishes the release without
  # running a single test (it has no test stage at all), and the release commit's
  # own main run is a different ref, so nothing otherwise gates a tag on green
  # tests. This run is concurrent with the release build rather than upstream of
  # it — it cannot block a bad publish, but it names one within ten minutes.
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Full debug info costs codegen, link time and disk on every one of the dozen
# test binaries that each embed athenaeum-core. `line-tables-only` keeps file
# and line in backtraces — the part that matters when a CI test fails — and
# drops the rest. It changes no generated code, so it cannot change a test
# outcome. Set here rather than in Cargo.toml so a developer build is untouched.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  build-and-test:
    name: Build, test and typecheck
    runs-on: ubuntu-latest
    # A hung test must not sit on a runner for the default six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Tauri 2 Linux prerequisites. The GitLab runners have these provisioned
      # on the host, so this list is the only place in the repository where the
      # dependency set is written down.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file

      # No toolchain version appears here on purpose: rustup reads
      # rust-toolchain.toml and installs what it pins, so CI can never drift
      # from the workspace. `rustup show` is what triggers that install.
      - name: Resolve the pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # One compilation pass, not two. `cargo build --workspace` followed by
      # `cargo test` compiled the workspace twice: once as plain libs and bins,
      # then again with cfg(test) plus every integration-test binary. `--no-run`
      # covers both in a single pass, and the run step below reuses its
      # artifacts.
      - name: Compile workspace and tests
        run: cargo test --workspace --no-run

      # Both cargo invocations MUST name the identical set of crates. Passing
      # `--exclude perseus` here changed the feature unification of the shared
      # dependencies, so cargo rebuilt 77 crates in this step — roughly 680 of
      # its 744 seconds went to recompiling rather than testing. Skipping the
      # tests by name keeps the unit graph identical and reuses the artifacts
      # from the step above.
      #
      # perseus's `unclean_shutdown_mid_transfer_resumes_on_restart` drives a
      # real iroh transfer over loopback and is load-sensitive: ~10-17s alone,
      # but past its 30s deadline when a full-workspace run saturates the cores.
      #
      # sync's `ingest_releases_conn_between_frames` is a timing probe that needs
      # a competing thread to win a race against an unfair mutex. On Windows, 4 of
      # 5 isolated runs failed; on macOS it surfaced three times during full-suite
      # load despite passing in isolation. The test also self-skips when `CI` is
      # set, so this flag is belt-and-braces here and does the actual skipping
      # for a developer running this same command locally without `CI` in the
      # environment.
      - name: Test workspace
        run: cargo test --workspace --no-fail-fast -- --skip unclean_shutdown_mid_transfer_resumes_on_restart --skip ingest_releases_conn_between_frames

      - name: Typecheck frontend
        run: npx tsc --noEmit

  # The Rust suite has only ever run on Linux: this workflow was ubuntu-only and
  # .gitlab-ci.yml contains `cargo test` zero times (its build:windows job is
  # `only: tags` and builds the bundle without testing). A Windows run on
  # 2026-09-06 found 39 pre-existing failures behind that gap. This job is the
  # measurement that keeps them closed.
  #
  # `continue-on-error` is deliberate and stays for now: every measurement this
  # cycle took was `cargo test -p athenaeum-core --lib`, while this job runs
  # `cargo test --workspace`. Same-class separator/path failures are already
  # known to exist in athenaeum-web and perseus, so this line comes out only
  # once a workspace-wide Windows run is actually green.
  # `--no-fail-fast` (below) means this job now runs all 41 test binaries
  # instead of stopping at the first one that fails, so the 60-minute budget
  # is load-bearing where it previously was not: a fail-fast run of this same
  # command stopped ~40s into athenaeum-core, while a full run compiles and
  # executes every binary. Compilation still dominates the wall clock, so 60
  # is expected to hold, but it is no longer slack against a stopped-early run.
  build-and-test-windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # No system-dependency step: the MSVC toolchain and the WebView2 runtime
      # Tauri needs are already on the windows-latest image. rustafits has needed
      # no nasm/cmake since it moved to a pure-Rust JPEG encoder (2026-07-29).
      - name: Resolve the pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      # This job is expected to be red for now, and the action does not save
      # a cache on a failed job by default — without this it rebuilds the
      # whole workspace cold on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The command MUST stay identical to the Linux job's. Two jobs running
      # different commands drift, and the whole point of this one is that it
      # measures the same thing on another platform.
      - name: Compile workspace and tests
        run: cargo test --workspace --no-run

      # `cargo test` is fail-fast across test binaries: without --no-fail-fast
      # it stops at the first binary that fails, so this job would report on
      # athenaeum-core alone and never execute the other 40 — a real run of
      # the fail-fast form went green on that basis while 228 failures in
      # athenaeum-web and perseus sat unexecuted behind it. Most of what
      # --no-fail-fast now surfaces from perseus is a single known, deferred
      # cause (a TOML-escaping fixture bug) plus a handful of undiagnosed
      # timeouts — see the Windows section of docs/superpowers/open-items.md
      # before re-diagnosing it.
      - name: Test workspace
        run: cargo test --workspace --no-fail-fast -- --skip unclean_shutdown_mid_transfer_resumes_on_restart --skip ingest_releases_conn_between_frames
