name: CI

on:
  # Documentation-only changes cannot break the build, and a cold run costs
  # over twenty minutes of runner time.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Tauri 2 Linux prerequisites. The GitLab runners have these provisioned
      # on the host, so this list is the only place in the repository where the
      # dependency set is written down.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file

      # No toolchain version appears here on purpose: rustup reads
      # rust-toolchain.toml and installs what it pins, so CI can never drift
      # from the workspace. `rustup show` is what triggers that install.
      - name: Resolve the pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # One compilation pass, not two. `cargo build --workspace` followed by
      # `cargo test` compiled the workspace twice: once as plain libs and bins,
      # then again with cfg(test) plus every integration-test binary. `--no-run`
      # covers both in a single pass, and the run step below reuses its
      # artifacts.
      - name: Compile workspace and tests
        run: cargo test --workspace --no-run

      # perseus is excluded from the run, not the compile. Its e2e_loopback
      # suite drives real iroh transfers over loopback and is load-sensitive:
      # `unclean_shutdown_mid_transfer_resumes_on_restart` finishes in ~10-17s
      # alone but times out at 30s when a full-workspace run saturates the
      # cores. It stays compiled here and is meant to be run on a developer
      # machine, where it is not competing for CPU.
      - name: Test workspace
        run: cargo test --workspace --exclude perseus

      - name: Typecheck frontend
        run: npx tsc --noEmit
