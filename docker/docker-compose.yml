services:
  athenaeum:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - athenaeum-data:/data
      - /Volumes/BigMac/Users/astrobureau/Pictures/Unsorted:/astro-files:rw
      - /Volumes/BigMac/Users/astrobureau/Pictures/Astro:/astro-main:ro
      - /Volumes/BigMac/Users/astrobureau/Pictures/docker_export:/exports:rw
    environment:
      - ATHENAEUM_DB_PATH=/data/athenaeum.db
      - ATHENAEUM_PORT=3000
      - ATHENAEUM_STATIC_DIR=/app/static
      - ATHENAEUM_ALLOWED_PATHS=/astro-files,/astro-main
      - ATHENAEUM_EXPORT_DIR=/exports
      # Optional: require an API key for /api/* (header X-API-Key or
      # Authorization: Bearer; the web UI prompts for it; SSE uses
      # ?api_key= since EventSource can't set headers). Unset = open.
      # - ATHENAEUM_API_KEY=changeme
    restart: unless-stopped

volumes:
  athenaeum-data:
