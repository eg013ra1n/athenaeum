[package]
name = "athenaeum"
version = "0.1.1"
description = "Astrophotography File Manager - FITS/XISF catalog and management tool"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "athenaeum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
walkdir = "2"
anyhow = "1"
quick-xml = "0.36"
rustafits = "0.4.2"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[profile.dev.package."*"]
opt-level = 2        # Optimize all dependencies in dev builds (image processing, rayon, etc.)

[profile.release]
lto = "thin"         # Thin LTO: ~95% of fat LTO perf at much faster compile
codegen-units = 4    # Parallel codegen — faster builds, negligible runtime cost
