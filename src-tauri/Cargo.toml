[package]
name = "athenaeum"
version = "0.1.0"
description = "Astrophotography File Manager - FITS/XISF catalog and management tool"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "athenaeum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
walkdir = "2"
fitsio = "0.21"
anyhow = "1"
thiserror = "2"
quick-xml = "0.36"
rustafits = { git = "https://github.com/eg013ra1n/rustafits" }
base64 = "0.22"

[profile.release]
lto = true           # Link-time optimization for cross-function inlining
codegen-units = 1    # Single compilation unit for better optimization

