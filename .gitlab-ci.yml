stages:
  - build
  - release

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  npm_config_cache: "${CI_PROJECT_DIR}/.npm"

# --- Windows Build ---
build:windows:
  stage: build
  tags:
    - windows
  only:
    - main
  cache:
    key: "${CI_COMMIT_REF_SLUG}-windows"
    policy: pull
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - npm ci
    - npm run tauri build
  artifacts:
    name: "athenaeum-windows-${CI_COMMIT_SHORT_SHA}"
    paths:
      - src-tauri/target/release/bundle/msi/*.msi
      - src-tauri/target/release/bundle/nsis/*.exe
    expire_in: 30 days

# --- Linux Build ---
build:linux:
  stage: build
  tags:
    - linux
  only:
    - main
  before_script:
    - source "$HOME/.cargo/env"
  cache:
    key: "${CI_COMMIT_REF_SLUG}-linux"
    policy: pull
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - npm ci
    - npm run tauri build
  artifacts:
    name: "athenaeum-linux-${CI_COMMIT_SHORT_SHA}"
    paths:
      - src-tauri/target/release/bundle/appimage/*.AppImage
      - src-tauri/target/release/bundle/deb/*.deb
    expire_in: 30 days

# --- Cache Warmers (update cache periodically on main) ---
update-cache:windows:
  stage: build
  tags:
    - windows
  only:
    - main
  when: manual
  cache:
    key: "${CI_COMMIT_REF_SLUG}-windows"
    policy: push
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - npm ci
    - npm run tauri build

update-cache:linux:
  stage: build
  tags:
    - linux
  only:
    - main
  when: manual
  before_script:
    - source "$HOME/.cargo/env"
  cache:
    key: "${CI_COMMIT_REF_SLUG}-linux"
    policy: push
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - npm ci
    - npm run tauri build

# --- Release (only on tags) ---
release:
  stage: release
  tags:
    - windows
  only:
    - tags
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: "${CI_COMMIT_TAG}"
    name: "Athenaeum ${CI_COMMIT_TAG}"
    description: "Release ${CI_COMMIT_TAG}"
    assets:
      links:
        - name: "Windows Installer (MSI)"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/src-tauri/target/release/bundle/msi/Athenaeum_${CI_COMMIT_TAG}_x64_en-US.msi"
        - name: "Windows Installer (EXE)"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/src-tauri/target/release/bundle/nsis/Athenaeum_${CI_COMMIT_TAG}_x64-setup.exe"
        - name: "Linux AppImage"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/src-tauri/target/release/bundle/appimage/athenaeum_${CI_COMMIT_TAG}_amd64.AppImage"
        - name: "Linux Debian Package"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/src-tauri/target/release/bundle/deb/athenaeum_${CI_COMMIT_TAG}_amd64.deb"
  needs:
    - job: build:windows
      artifacts: true
    - job: build:linux
      artifacts: true
