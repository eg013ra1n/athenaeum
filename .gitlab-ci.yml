workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never

stages:
  - build
  - deploy
  - release
  - mirror

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  npm_config_cache: "${CI_PROJECT_DIR}/.npm"

# --- Windows Build ---
build:windows:
  stage: build
  tags:
    - windows
  only:
    - tags
  needs:
    - job: build:linux
      artifacts: false
  cache:
    key: "main-windows"
    policy: pull
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - if (Test-Path "src-tauri\target\release\bundle") { Remove-Item -Recurse -Force "src-tauri\target\release\bundle" }
    - npm install
    - npm run tauri build
  artifacts:
    name: "athenaeum-windows-${CI_COMMIT_SHORT_SHA}"
    paths:
      - src-tauri/target/release/bundle/msi/*.msi
      - src-tauri/target/release/bundle/nsis/*.exe
    expire_in: 30 days

# --- Linux Build ---
build:linux:
  stage: build
  tags:
    - linux
  only:
    - tags
  before_script:
    - source "$HOME/.cargo/env"
  cache:
    key: "main-linux"
    policy: pull
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - export RUSTAFITS_PORTABLE=1
    - rm -rf src-tauri/target/release/bundle/
    - npm install
    - npm run tauri build
  artifacts:
    name: "athenaeum-linux-${CI_COMMIT_SHORT_SHA}"
    paths:
      - src-tauri/target/release/bundle/appimage/*.AppImage
      - src-tauri/target/release/bundle/deb/*.deb
    expire_in: 30 days

# --- macOS Build (Apple Silicon + Intel) ---
build:macos:
  stage: build
  tags:
    - macos
  only:
    - tags
  cache:
    key: "main-macos"
    policy: pull
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - rm -rf src-tauri/target/aarch64-apple-darwin/release/bundle/
    - rm -rf src-tauri/target/x86_64-apple-darwin/release/bundle/
    - npm install
    - npm run tauri build -- --target aarch64-apple-darwin
    - npm run tauri build -- --target x86_64-apple-darwin
  artifacts:
    name: "athenaeum-macos-${CI_COMMIT_SHORT_SHA}"
    paths:
      - src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
      - src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    expire_in: 30 days

# --- Cache Warmers (update cache periodically on main) ---
update-cache:windows:
  stage: build
  tags:
    - windows
  only:
    - main
  when: manual
  cache:
    key: "main-windows"
    policy: push
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - npm install
    - npm run tauri build

update-cache:linux:
  stage: build
  tags:
    - linux
  only:
    - main
  when: manual
  before_script:
    - source "$HOME/.cargo/env"
  cache:
    key: "main-linux"
    policy: push
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - export RUSTAFITS_PORTABLE=1
    - npm install
    - npm run tauri build

update-cache:macos:
  stage: build
  tags:
    - macos
  only:
    - main
  when: manual
  cache:
    key: "main-macos"
    policy: push
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - npm install
    - npm run tauri build -- --target aarch64-apple-darwin
    - npm run tauri build -- --target x86_64-apple-darwin

# --- Deploy to Web Server (tags only) ---
deploy:
  stage: deploy
  tags:
    - linux
  only:
    - tags
  variables:
    DEPLOY_PORT: "40022"
    BUILDS_PATH: "/var/www/artfrom.space/builds"
    SSH_CMD: "ssh -p ${DEPLOY_PORT}"
    SCP_CMD: "scp -P ${DEPLOY_PORT}"
  needs:
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
    - job: build:macos
      artifacts: true
  before_script:
    - eval $(ssh-agent -s)
    - chmod 400 "$DEPLOY_SSH_KEY"
    - ssh-add "$DEPLOY_SSH_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p ${DEPLOY_PORT} -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # Rename artifacts to include tag in filename
    - mv src-tauri/target/release/bundle/appimage/*.AppImage "src-tauri/target/release/bundle/appimage/athenaeum_${CI_COMMIT_TAG}_amd64.AppImage"
    - mv src-tauri/target/release/bundle/deb/*.deb "src-tauri/target/release/bundle/deb/athenaeum_${CI_COMMIT_TAG}_amd64.deb"
    - mv src-tauri/target/release/bundle/msi/*.msi "src-tauri/target/release/bundle/msi/Athenaeum_${CI_COMMIT_TAG}_x64_en-US.msi"
    - mv src-tauri/target/release/bundle/nsis/*.exe "src-tauri/target/release/bundle/nsis/Athenaeum_${CI_COMMIT_TAG}_x64-setup.exe"
    - mv src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Athenaeum_${CI_COMMIT_TAG}_aarch64.dmg"
    - mv src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/Athenaeum_${CI_COMMIT_TAG}_x64.dmg"
    # Create directories on remote
    - ${SSH_CMD} ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${BUILDS_PATH}/${CI_COMMIT_TAG}/linux ${BUILDS_PATH}/${CI_COMMIT_TAG}/windows ${BUILDS_PATH}/${CI_COMMIT_TAG}/macos"
    # Upload Linux artifacts
    - ${SCP_CMD} src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb ${DEPLOY_USER}@${DEPLOY_HOST}:${BUILDS_PATH}/${CI_COMMIT_TAG}/linux/
    # Upload Windows artifacts
    - ${SCP_CMD} src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe ${DEPLOY_USER}@${DEPLOY_HOST}:${BUILDS_PATH}/${CI_COMMIT_TAG}/windows/
    # Upload macOS artifacts
    - ${SCP_CMD} src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg ${DEPLOY_USER}@${DEPLOY_HOST}:${BUILDS_PATH}/${CI_COMMIT_TAG}/macos/
    # Update latest/ symlink to point to this release
    - ${SSH_CMD} ${DEPLOY_USER}@${DEPLOY_HOST} "ln -sfn ${BUILDS_PATH}/${CI_COMMIT_TAG} ${BUILDS_PATH}/latest"
  after_script:
    - ssh-agent -k 2>/dev/null || true

# --- Release (only on tags) ---
release:
  stage: release
  tags:
    - windows
  only:
    - tags
  needs:
    - job: deploy
      artifacts: false
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: "${CI_COMMIT_TAG}"
    name: "Athenaeum ${CI_COMMIT_TAG}"
    description: "Release ${CI_COMMIT_TAG}"
    assets:
      links:
        - name: "Windows Installer (MSI)"
          url: "https://artfrom.space/builds/${CI_COMMIT_TAG}/windows/Athenaeum_${CI_COMMIT_TAG}_x64_en-US.msi"
        - name: "Windows Installer (EXE)"
          url: "https://artfrom.space/builds/${CI_COMMIT_TAG}/windows/Athenaeum_${CI_COMMIT_TAG}_x64-setup.exe"
        - name: "Linux AppImage"
          url: "https://artfrom.space/builds/${CI_COMMIT_TAG}/linux/athenaeum_${CI_COMMIT_TAG}_amd64.AppImage"
        - name: "Linux Debian Package"
          url: "https://artfrom.space/builds/${CI_COMMIT_TAG}/linux/athenaeum_${CI_COMMIT_TAG}_amd64.deb"
        - name: "macOS Disk Image (Apple Silicon)"
          url: "https://artfrom.space/builds/${CI_COMMIT_TAG}/macos/Athenaeum_${CI_COMMIT_TAG}_aarch64.dmg"
        - name: "macOS Disk Image (Intel)"
          url: "https://artfrom.space/builds/${CI_COMMIT_TAG}/macos/Athenaeum_${CI_COMMIT_TAG}_x64.dmg"

publish_version:
  stage: release
  tags:
    - linux
  only:
    - tags
  needs:
    - job: release
      artifacts: false
  variables:
    DEPLOY_PORT: "40022"
    SSH_CMD: "ssh -p ${DEPLOY_PORT}"
    SCP_CMD: "scp -P ${DEPLOY_PORT}"
  before_script:
    - eval $(ssh-agent -s)
    - chmod 400 "$DEPLOY_SSH_KEY"
    - ssh-add "$DEPLOY_SSH_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p ${DEPLOY_PORT} -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - printf '{"version":"%s","download_url":"https://artfrom.space/releases/download"}' "$VERSION" > version.json
    - ${SCP_CMD} version.json ${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/artfrom.space/version.json
  after_script:
    - ssh-agent -k 2>/dev/null || true

# --- Mirror to GitHub (main and tags) ---
mirror:github:
  stage: mirror
  tags:
    - linux
  only:
    - main
    - tags
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 1
  before_script:
    - eval $(ssh-agent -s)
    - chmod 400 "$GITHUB_DEPLOY_KEY"
    - ssh-add "$GITHUB_DEPLOY_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - bash scripts/sync-github.sh "git@github.com:eg013ra1n/athenaeum.git"
  after_script:
    - ssh-agent -k 2>/dev/null || true
