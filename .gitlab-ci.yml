stages:
  - build
  - deploy
  - release

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  npm_config_cache: "${CI_PROJECT_DIR}/.npm"

# --- Windows Build ---
build:windows:
  stage: build
  tags:
    - windows
  only:
    - main
  cache:
    key: "${CI_COMMIT_REF_SLUG}-windows"
    policy: pull
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - npm ci
    - npm run tauri build
  artifacts:
    name: "athenaeum-windows-${CI_COMMIT_SHORT_SHA}"
    paths:
      - src-tauri/target/release/bundle/msi/*.msi
      - src-tauri/target/release/bundle/nsis/*.exe
    expire_in: 30 days

# --- Linux Build ---
build:linux:
  stage: build
  tags:
    - linux
  only:
    - main
  before_script:
    - source "$HOME/.cargo/env"
  cache:
    key: "${CI_COMMIT_REF_SLUG}-linux"
    policy: pull
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - export RUSTAFITS_PORTABLE=1
    - npm ci
    - npm run tauri build
  artifacts:
    name: "athenaeum-linux-${CI_COMMIT_SHORT_SHA}"
    paths:
      - src-tauri/target/release/bundle/appimage/*.AppImage
      - src-tauri/target/release/bundle/deb/*.deb
    expire_in: 30 days

# --- macOS Build (Apple Silicon + Intel) ---
build:macos:
  stage: build
  tags:
    - macos
  only:
    - main
  cache:
    key: "${CI_COMMIT_REF_SLUG}-macos"
    policy: pull
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - npm ci
    - npm run tauri build -- --target aarch64-apple-darwin
    - npm run tauri build -- --target x86_64-apple-darwin
  artifacts:
    name: "athenaeum-macos-${CI_COMMIT_SHORT_SHA}"
    paths:
      - src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
      - src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    expire_in: 30 days

# --- Cache Warmers (update cache periodically on main) ---
update-cache:windows:
  stage: build
  tags:
    - windows
  only:
    - main
  when: manual
  cache:
    key: "${CI_COMMIT_REF_SLUG}-windows"
    policy: push
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - npm ci
    - npm run tauri build

update-cache:linux:
  stage: build
  tags:
    - linux
  only:
    - main
  when: manual
  before_script:
    - source "$HOME/.cargo/env"
  cache:
    key: "${CI_COMMIT_REF_SLUG}-linux"
    policy: push
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - export RUSTAFITS_PORTABLE=1
    - npm ci
    - npm run tauri build

update-cache:macos:
  stage: build
  tags:
    - macos
  only:
    - main
  when: manual
  cache:
    key: "${CI_COMMIT_REF_SLUG}-macos"
    policy: push
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
  script:
    - npm ci
    - npm run tauri build -- --target aarch64-apple-darwin
    - npm run tauri build -- --target x86_64-apple-darwin

# --- Deploy to Web Server (main only) ---
deploy:
  stage: deploy
  tags:
    - linux
  only:
    - main
  variables:
    DEPLOY_PORT: "40022"
    BUILDS_PATH: "/var/www/artfrom.space/builds"
    SSH_CMD: "ssh -p ${DEPLOY_PORT}"
    SCP_CMD: "scp -P ${DEPLOY_PORT}"
  needs:
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
    - job: build:macos
      artifacts: true
  before_script:
    - eval $(ssh-agent -s)
    - chmod 400 "$DEPLOY_SSH_KEY"
    - ssh-add "$DEPLOY_SSH_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p ${DEPLOY_PORT} -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # Create directories on remote
    - ${SSH_CMD} ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${BUILDS_PATH}/${CI_COMMIT_SHORT_SHA}/linux ${BUILDS_PATH}/${CI_COMMIT_SHORT_SHA}/windows ${BUILDS_PATH}/${CI_COMMIT_SHORT_SHA}/macos"
    # Upload Linux artifacts
    - ${SCP_CMD} src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb ${DEPLOY_USER}@${DEPLOY_HOST}:${BUILDS_PATH}/${CI_COMMIT_SHORT_SHA}/linux/
    # Upload Windows artifacts
    - ${SCP_CMD} src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe ${DEPLOY_USER}@${DEPLOY_HOST}:${BUILDS_PATH}/${CI_COMMIT_SHORT_SHA}/windows/
    # Upload macOS artifacts
    - ${SCP_CMD} src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg ${DEPLOY_USER}@${DEPLOY_HOST}:${BUILDS_PATH}/${CI_COMMIT_SHORT_SHA}/macos/
    # Update latest/ symlink (atomic swap)
    - ${SSH_CMD} ${DEPLOY_USER}@${DEPLOY_HOST} "ln -sfn ${BUILDS_PATH}/${CI_COMMIT_SHORT_SHA} ${BUILDS_PATH}/latest"
  after_script:
    - ssh-agent -k 2>/dev/null || true

# --- Release (only on tags) ---
release:
  stage: release
  tags:
    - windows
  only:
    - tags
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: "${CI_COMMIT_TAG}"
    name: "Athenaeum ${CI_COMMIT_TAG}"
    description: "Release ${CI_COMMIT_TAG}"
    assets:
      links:
        - name: "Windows Installer (MSI)"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/src-tauri/target/release/bundle/msi/Athenaeum_${CI_COMMIT_TAG}_x64_en-US.msi"
        - name: "Windows Installer (EXE)"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/src-tauri/target/release/bundle/nsis/Athenaeum_${CI_COMMIT_TAG}_x64-setup.exe"
        - name: "Linux AppImage"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/src-tauri/target/release/bundle/appimage/athenaeum_${CI_COMMIT_TAG}_amd64.AppImage"
        - name: "Linux Debian Package"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/src-tauri/target/release/bundle/deb/athenaeum_${CI_COMMIT_TAG}_amd64.deb"
        - name: "macOS Disk Image (Apple Silicon)"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Athenaeum_${CI_COMMIT_TAG}_aarch64.dmg"
        - name: "macOS Disk Image (Intel)"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/Athenaeum_${CI_COMMIT_TAG}_x64.dmg"
  needs:
    - job: build:windows
      artifacts: true
    - job: build:linux
      artifacts: true
    - job: build:macos
      artifacts: true
