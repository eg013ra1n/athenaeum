workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never

stages:
  - gate      # check:versions — refuse a tag that cannot be a release
  - build     # the seven installers + check:headless-core + gate:tests
  - deploy    # rename + upload to artfrom.space/builds/<tag>/
  - publish   # Docker Hub (3 jobs) + the docs site
  - verify    # fetch everything back; Gatekeeper on the real DMGs; BLOCKING
  - announce  # GitLab Release, version.json, channel symlinks, Discord, Telegram — only after verify

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  npm_config_cache: "${CI_PROJECT_DIR}/.npm"
  # Pull in the rustafits submodule on every job's checkout. Without this
  # the runner logs "Skipping Git submodules setup" and `cargo metadata`
  # fails with "failed to read rustafits/Cargo.toml" because the workspace
  # member isn't on disk. `recursive` covers any nested submodule rustafits
  # itself might add later.
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  # Keep the build products between jobs. The runner's default clean is
  # `-ffdx`, which deletes every untracked path — `target/`, the Cargo registry
  # (CARGO_HOME above points inside the project dir) and the npm cache with it —
  # so every job used to start cold and re-download its crates. That is the hole
  # the `cache:` blocks were plugging, at a cost far higher than the hole: on
  # macOS, 2:05 to restore and 25:05 to archive, to save about six minutes of
  # compile (measured 2026-09-16, pipelines 369 and 372 — with the cache the two
  # macOS targets compiled in 4:02 and 6:50, without it 9:34 and 7:24).
  #
  # Excluding those three paths from the clean is the cheap way to the same
  # result: the runners are persistent machines with per-slot build directories,
  # so the products simply stay where they were written, and nothing is packed
  # or unpacked at all. Everything tracked is still cleaned, so a stale working
  # tree cannot survive. Disk cost is one `target/` per runner slot.
  GIT_CLEAN_FLAGS: -ffdx -e target/ -e .cargo/ -e .npm/

# --- Gate (tags only) ---
# One refusal before a single build minute is spent: the six version files
# must equal the tag (bump.sh's job to make them so). The other half of the
# gate, gate:tests — the tagged commit's GitHub check-suite, the only place
# tests actually run — lives down in the `build` stage, not here (see its
# own comment below for why); the `gate` stage itself holds only this job.
check:versions:
  stage: gate
  tags: [linux]
  only: [tags]
  needs: []
  script:
    - TAG="${CI_COMMIT_TAG}" .gitlab/ci/scripts/check_versions.sh

# --- Windows Build ---
build:windows:
  stage: build
  tags:
    - windows
  only:
    - tags
  # Dedicated windows machine — starts parallel to linux/macos, gated only on
  # the (seconds-long) check:versions job. (The old `needs: build:linux` gate
  # predates the dedicated runner and cost every release a serialized ~14 min.)
  needs: ["check:versions"]
  # No cache, deliberately — GIT_CLEAN_FLAGS at the top of this file does the
  # same job for free. What a cache bought here was a warm `target/` after the
  # runner's default `-ffdx` clean deleted it; not deleting it in the first
  # place is strictly cheaper, because nothing is packed or unpacked.
  #
  # What the cache cost, measured on pipeline 369 (v0.6.4-beta.1),
  # restore + archive:
  #   macOS    2:05 + 25:05  of a 41:42 job
  #   Windows  1:00 +  2:08  of a 15:24 job
  #   Linux    1:35 +  1:40  of a 15:12 job
  # against roughly six minutes of compile saved on macOS. 29 438 registry
  # files and 12 480 target files were being packed into a LOCAL archive on
  # every release: none of the three runners has a shared cache server (all
  # log "No URL provided"), so it could only ever be restored onto the machine
  # that wrote it. The comment removed with the cache claimed it let "a fresh
  # runner machine warm itself on the first tag", which a machine-local cache
  # cannot do — a fresh machine has no cache to restore.
  script:
    - if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { Write-Error "FATAL: TAURI_SIGNING_PRIVATE_KEY is empty - is the tag a Protected tag?"; exit 1 }
    # No cmake/nasm bootstrap here any more. turbojpeg-sys (the only crate that
    # needed cmake, and the only one that shelled out to nasm — via
    # libjpeg-turbo's own build) is out of Cargo.lock since both rustafits and
    # jpeg-encode moved to pure-Rust libjpeg-turbo-rs. `ring`, the other
    # Windows crate with .asm in it, does NOT need a PATH nasm: the crates.io
    # package ships no `.git`, so its build.rs takes the `pregenerated/` branch
    # with prebuilt *-nasm.o objects, and even its git-checkout branch invokes a
    # vendored `./target/tools/windows/nasm/nasm`, never PATH.
    - if (Test-Path "target\release\bundle") { Remove-Item -Recurse -Force "target\release\bundle" }
    - npm install
    - npm run tauri build
  artifacts:
    name: "athenaeum-windows-${CI_COMMIT_SHORT_SHA}"
    paths:
      - target/release/bundle/msi/*.msi
      - target/release/bundle/msi/*.msi.sig
      - target/release/bundle/nsis/*.exe
      - target/release/bundle/nsis/*.exe.sig
    expire_in: 30 days

# --- Linux Build ---
build:linux:
  stage: build
  tags:
    - linux
  only:
    - tags
  needs: ["check:versions"]
  variables:
    # The ubuntu24 runner has fuse3 only; the linuxdeploy AppImage that
    # tauri-bundler downloads dlopens libfuse.so.2 and dies without this.
    # Extract-and-run needs no FUSE at all (verified on the runner 2026-07-18).
    APPIMAGE_EXTRACT_AND_RUN: "1"
  before_script:
    - source "$HOME/.cargo/env"
    # The cmake/nasm host precheck that used to live here is gone: it guarded
    # rustafits → turbojpeg-sys → libjpeg-turbo, and turbojpeg-sys left
    # Cargo.lock when both rustafits and jpeg-encode moved to pure-Rust
    # libjpeg-turbo-rs. On ELF targets `ring` assembles through cc/gas, not
    # nasm. Nothing else in the tree uses the `cmake` crate. (The tools may
    # still be installed on the runner host; this job simply no longer cares.)
  # No cache — see the comment in build:windows for why this pipeline has none.
  script:
    - '[ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "FATAL: TAURI_SIGNING_PRIVATE_KEY is empty — is the tag a Protected tag?"; exit 1; }'
    - export RUSTAFITS_PORTABLE=1
    - rm -rf target/release/bundle/
    - npm install
    - npm run tauri build
  artifacts:
    name: "athenaeum-linux-${CI_COMMIT_SHORT_SHA}"
    paths:
      - target/release/bundle/appimage/*.AppImage
      - target/release/bundle/appimage/*.AppImage.sig
      - target/release/bundle/deb/*.deb
    expire_in: 30 days

# --- Headless core guard ---
# Perseus (the headless sync agent) depends on athenaeum-core with
# `default-features = false`, omitting the rustafits/solvemyastro submodules.
# This job guards that the core library keeps compiling without them, and it
# deliberately installs NO native build tools.
#
# That second half was a dead letter for a while: the old `jpeg-encode` helper
# crate was an UNCONDITIONAL dep of athenaeum-core, so while it bound the C
# libjpeg-turbo this job did need cmake/nasm and only passed because the linux
# runner host happened to have them. jpeg-encode is gone entirely now — JPEG
# encoding lives in the render-gated rustafits submodule (pure-Rust
# libjpeg-turbo-rs), so the headless build carries no JPEG encoder at all and
# the no-native-tools invariant is real: a regression here means a genuine
# C-toolchain dep crept in.
#
# Runs on every main commit + tag (not `only: tags`) so a regression is caught
# before release.
check:headless-core:
  stage: build
  tags:
    - linux
  before_script:
    - source "$HOME/.cargo/env"
  # No cache — see the comment in build:windows for why this pipeline has none.
  script:
    - cargo check -p athenaeum-core --no-default-features

# --- Shared macOS signing/notarization setup (hidden template job) ---
# Single source of truth for the Developer ID signing dance: before_script
# materializes the .p12 cert + .p8 notary key into a throwaway per-job keychain
# and makes it the default; after_script tears it all down. Reused via
# `extends:` by BOTH build:macos (Tauri self-signs via APPLE_SIGNING_IDENTITY)
# and build:perseus:macos (hand-codesigns via build_app.sh). It only carries the
# scripts — each consumer keeps its own stage/tags/only/cache/script/artifacts.
.macos_signing_setup:
  before_script:
    # Fail loudly if a signing variable is missing (e.g. the tag is not a
    # Protected tag) instead of silently producing an UNSIGNED dmg.
    - |
      for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD \
               APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8_BASE64; do
        if [ -z "${!v}" ]; then
          echo "FATAL: signing variable '$v' is empty — is the tag a Protected tag?"; exit 1
        fi
      done
    # Deterministic per-job paths (recomputed identically in after_script).
    - export KEYCHAIN_PATH="$HOME/athenaeum-signing-${CI_JOB_ID}.keychain-db"
    - export CERT_PATH="$HOME/athenaeum-cert-${CI_JOB_ID}.p12"
    - export APPLE_API_KEY_PATH="$HOME/athenaeum-api-key-${CI_JOB_ID}.p8"
    # Materialize the .p12 cert and the .p8 notarization key from base64 vars.
    - echo "$APPLE_CERTIFICATE"       | base64 --decode > "$CERT_PATH"
    - echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH"
    - chmod 600 "$APPLE_API_KEY_PATH"
    # Fresh, isolated keychain for THIS job only; import the cert.
    - security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
    - security set-keychain-settings -t 21600 -u "$KEYCHAIN_PATH"   # 6h timeout; survives notarization waits
    - security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
    - security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
    # Apple's Developer ID intermediate CAs: the leaf must build a FULL chain
    # inside search-visible keychains or codesign reports "no identity found"
    # (invalid identities are invisible to it). On a dev Mac the intermediates
    # live in the login keychain, which a runner (daemon) session may not see —
    # so import them into OUR keychain.
    - curl -fsSLo "$HOME/AppleDevIDCA-${CI_JOB_ID}.cer" https://www.apple.com/certificateauthority/DeveloperIDCA.cer
    - curl -fsSLo "$HOME/AppleDevIDG2CA-${CI_JOB_ID}.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
    - security import "$HOME/AppleDevIDCA-${CI_JOB_ID}.cer" -k "$KEYCHAIN_PATH" || true
    - security import "$HOME/AppleDevIDG2CA-${CI_JOB_ID}.cer" -k "$KEYCHAIN_PATH" || true
    - rm -f "$HOME/AppleDevIDCA-${CI_JOB_ID}.cer" "$HOME/AppleDevIDG2CA-${CI_JOB_ID}.cer"
    # Mandatory on a self-hosted runner: lets codesign use the private key non-interactively.
    # Block scalar: the `codesign:` in the partition list contains a colon+space
    # that YAML would otherwise parse as a mapping.
    - |
      security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
    # Add our keychain to the user search list WITHOUT dropping the login keychain.
    - security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
    # Some runner sessions resolve identities only via the DEFAULT keychain, not
    # the user search list — make ours the default (restored in after_script).
    - security default-keychain -d user -s "$KEYCHAIN_PATH"
    # Diagnostics: identity scoped to our keychain AND session-wide (the second
    # is what codesign actually sees). Expect 1 valid identity in BOTH.
    - security find-identity -v -p codesigning "$KEYCHAIN_PATH"
    - security find-identity -v -p codesigning
    - rm -f "$CERT_PATH"
  after_script:
    # Fresh shell: recompute the same paths and clean up unconditionally.
    # Restore the login keychain as default FIRST, then delete ours.
    - security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" 2>/dev/null || true
    - KEYCHAIN_PATH="$HOME/athenaeum-signing-${CI_JOB_ID}.keychain-db"
    - security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
    - rm -f "$KEYCHAIN_PATH" "$HOME/athenaeum-cert-${CI_JOB_ID}.p12" "$HOME/athenaeum-api-key-${CI_JOB_ID}.p8"

# --- macOS Build (Apple Silicon + Intel) — signed + notarized (Developer ID) ---
# Secrets come from Protected CI/CD variables; the .p12/.p8 are decoded at
# runtime into a throwaway per-job keychain and removed in after_script.
build:macos:
  stage: build
  extends: .macos_signing_setup
  tags:
    - macos
  only:
    - tags
  needs: ["check:versions"]
  # No cache — see the comment in build:windows for why this pipeline has none.
  script:
    - '[ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "FATAL: TAURI_SIGNING_PRIVATE_KEY is empty — is the tag a Protected tag?"; exit 1; }'
    # No `brew install cmake nasm` here any more — turbojpeg-sys is out of
    # Cargo.lock (see build:windows). Apple targets never took `ring`'s nasm
    # path anyway: its macosx/ios64 perlasm output assembles through cc.
    - export PATH="$HOME/.cargo/bin:$PATH"
    - which cargo && rustc --print sysroot
    - rustup target add x86_64-apple-darwin
    - rm -rf target/aarch64-apple-darwin/release/bundle/
    - rm -rf target/x86_64-apple-darwin/release/bundle/
    - npm install
    # Unset APPLE_CERTIFICATE so Tauri does NOT create its own keychain: it would
    # import the cert WITHOUT a key-partition-list, and codesign then fails with
    # "Developer ID Application: … no identity found". Signing instead uses
    # APPLE_SIGNING_IDENTITY against the keychain set up in before_script (which
    # DOES have the partition-list). The `unset` above does not touch
    # APPLE_API_* — the DMG loop below needs them.
    - unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
    # D4 (in-app updates spec): tauri build notarizes + staples the .app
    # itself again, so the updater's .app.tar.gz carries a stapled bundle.
    # Ruling F5.1 (DMG-only notarization) is reversed by that spec; the DMG
    # loop below still notarizes the DMG a first-time user downloads.
    - npm run tauri build -- --target aarch64-apple-darwin
    - npm run tauri build -- --target x86_64-apple-darwin
    - |
      for DMG in target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
                 target/x86_64-apple-darwin/release/bundle/dmg/*.dmg; do
        echo "Notarizing $DMG ..."
        xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
        xcrun stapler staple "$DMG" && xcrun stapler validate "$DMG"
      done
  artifacts:
    name: "athenaeum-macos-${CI_COMMIT_SHORT_SHA}"
    paths:
      - target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
      - target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
      - target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
      - target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
      - target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
      - target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
    expire_in: 30 days

# --- Runner smoke (main, manual) ---
# A ten-second job per runner to prove it takes work — the thing to play after
# a runner restart or a machine reboot. It is NOT a build. Replaces the old
# update-cache:{windows,linux,macos} warmers, which had nothing left to warm:
# every runner here is a shell executor whose build directory survives between
# jobs, so `target/` is already there — see the comment in build:windows.
.runner_smoke:
  stage: build
  only: [main]
  when: manual
  script:
    - echo "runner ok on $(hostname)"; pwd; echo "PWD=$PWD"

smoke:macos:
  extends: .runner_smoke
  tags: [macos]
smoke:linux:
  extends: .runner_smoke
  tags: [linux]
smoke:windows:
  extends: .runner_smoke
  tags: [windows]
  script:
    - Write-Output "runner ok on $env:COMPUTERNAME"; Get-Location

# --- Perseus (headless sync agent) — desktop installers (tags only) ---
# Perseus ships as its own set of installers alongside Athenaeum. What each job
# builds differs: macOS (via packaging/macos/build_app.sh) and Windows build
# `-p perseus --features tray`; Linux builds the headless binary first
# (`--no-default-features --features preview`) for the tar.gz, then `cargo deb`
# for the tray variant.
#
# rustafits is in the graph in every one of those: perseus takes a DIRECT
# optional dep on the submodule behind its own `preview` feature (on by default,
# and passed explicitly in the headless build). That is separate from
# athenaeum-core's `render` feature — `athenaeum-core = { default-features =
# false }` drops both of core's gated deps, i.e. the `render` (rustafits image
# pipeline) and `solver` (solvemyastro) modules, none of which a capture node
# uses.
#
# No C toolchain in any variant since the JPEG encoder went pure-Rust, which is
# what lets these jobs and the arm64 container build with only the Rust
# toolchain. Signed/notarized on macOS via the shared .macos_signing_setup; the
# deploy job renames + uploads the artifacts and creates stable-named aliases.

build:perseus:macos:
  stage: build
  extends: .macos_signing_setup
  tags:
    - macos
  only:
    - tags
  needs: ["check:versions"]
  script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup target add x86_64-apple-darwin
    - VERSION="${CI_COMMIT_TAG#v}"
    # build_app.sh builds+assembles+codesigns Perseus.app (uses APPLE_SIGNING_IDENTITY
    # against the keychain set up by the shared before_script) and produces the dmg.
    - bash crates/perseus/packaging/macos/build_app.sh aarch64-apple-darwin "$VERSION"
    - bash crates/perseus/packaging/macos/build_app.sh x86_64-apple-darwin "$VERSION"
    # Notarize + staple each dmg (APPLE_API_KEY_PATH exported by before_script).
    - |
      for DMG in target/aarch64-apple-darwin/release/bundle/perseus-*.dmg \
                 target/x86_64-apple-darwin/release/bundle/perseus-*.dmg; do
        echo "Notarizing $DMG ..."
        xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
        xcrun stapler staple "$DMG" && xcrun stapler validate "$DMG"
      done
  artifacts:
    name: "perseus-macos-${CI_COMMIT_SHORT_SHA}"
    paths:
      - target/aarch64-apple-darwin/release/bundle/perseus-*.dmg
      - target/x86_64-apple-darwin/release/bundle/perseus-*.dmg
    expire_in: 30 days

build:perseus:windows:
  stage: build
  tags:
    - windows
  only:
    - tags
  needs:
    - check:versions
    - job: build:windows
      artifacts: false
  script:
    # Resolve makensis by FULL PATH: the chocolatey nsis package installs to
    # "C:\Program Files (x86)\NSIS" but adds NO PATH entry and NO shim, so
    # Get-Command/PATH-refresh never find it (v0.4.0-beta.1 pipeline 220 proof).
    - |
      $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
      if (-not $makensis) { $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe" }
      if (-not (Test-Path $makensis)) {
        choco install -y --no-progress nsis
        $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
      }
      if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis after install" }
      $env:PERSEUS_MAKENSIS = $makensis
    - cargo build --release -p perseus --features tray
    # Build the installer from the .nsi's OWN directory so its relative File/icon
    # paths (and the OutFile) resolve against it; EXE is 4 levels up at target/release.
    - |
      $VERSION = "$env:CI_COMMIT_TAG".TrimStart("v")
      Push-Location crates\perseus\packaging\windows
      try {
        & $env:PERSEUS_MAKENSIS /DVERSION=$VERSION /DEXE=..\..\..\..\target\release\perseus.exe perseus.nsi
        if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
      } finally {
        Pop-Location
      }
  artifacts:
    name: "perseus-windows-${CI_COMMIT_SHORT_SHA}"
    paths:
      - crates/perseus/packaging/windows/perseus-*-setup.exe
    expire_in: 30 days

build:perseus:linux:
  stage: build
  tags:
    - linux
  only:
    - tags
  needs: ["check:versions"]
  before_script:
    - source "$HOME/.cargo/env"
    # The desktop (tray) variant links against gtk/appindicator AND libxdo (-lxdo).
    # These dev headers must be pre-installed on the runner host (the gitlab-runner
    # user cannot sudo non-interactively). One-time setup on the runner host:
    #   sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
    - |
      missing=()
      for p in libgtk-3-dev libayatana-appindicator3-dev libxdo-dev; do
        dpkg -s "$p" >/dev/null 2>&1 || missing+=("$p")
      done
      if [ ${#missing[@]} -gt 0 ]; then
        echo "ERROR: missing dev headers on runner: ${missing[*]}"
        echo "Run on the runner host: sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev"
        exit 1
      fi
    - command -v cargo-deb >/dev/null || cargo install cargo-deb --locked
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    # Drop any stale perseus artifacts from a prior run on this persistent runner
    # so the deploy globs never match a leftover from an older version.
    - rm -f target/debian/perseus*.deb target/debian/perseus*.tar.gz
    # ORDER IS LOAD-BEARING: build + tar the HEADLESS binary FIRST, then cargo deb.
    # cargo deb builds the tray variant (GTK/appindicator/libxdo-linked) and
    # overwrites target/release/perseus, which is useless on a headless x64 server
    # — so the amd64 tar.gz must capture the --no-default-features build beforehand.
    # `--features preview` is NOT optional here: --no-default-features drops the
    # tray AND the frame renderer, and a headless server package without the
    # renderer serves /api/library/preview as a 404 stub (empty Library tab).
    - cargo build --release -p perseus --no-default-features --features preview   # headless (no tray)
    # cargo deb used to create target/debian/ as a side effect; with the tar now
    # running first (headless ordering above), the dir must exist explicitly
    # (pipeline 222 failure: "Cannot open: No such file or directory").
    - mkdir -p target/debian
    - tar czf "target/debian/perseus-${VERSION}-linux-amd64.tar.gz" -C target/release perseus
    - (cd crates/perseus && cargo deb -- -p perseus)   # desktop variant (tray); overwrites target/release/perseus
    # The .deb embeds the CRATE version; the tag drives the tar.gz + release links.
    # At tag time they must match (the version bump is a separate release step) —
    # warn, never block, on a mismatch.
    - |
      DEB=$(ls target/debian/perseus_*_amd64.deb 2>/dev/null | head -n1)
      # cargo-deb rewrites a semver pre-release '0.4.0-beta.1' to Debian's tilde
      # form '0.4.0~beta.1' ('-' is forbidden in the upstream version), so match
      # the deb name against the tilde-substituted tag.
      VERSION_DEB="${VERSION//-/\~}"
      case "$DEB" in
        */perseus_${VERSION_DEB}-1_amd64.deb) echo "perseus .deb version OK: $DEB" ;;
        *) echo "WARNING: perseus .deb '$DEB' does not embed tag version '${VERSION}' (expected ${VERSION_DEB}-1) — is the crate version bumped to match the tag?" ;;
      esac
  artifacts:
    name: "perseus-linux-${CI_COMMIT_SHORT_SHA}"
    paths:
      - target/debian/*.deb
      - target/debian/*.tar.gz
    expire_in: 30 days

build:perseus:linux-arm64:
  stage: build
  tags:
    - macos          # OrbStack docker, native arm64 container build
  only:
    - tags
  needs: ["check:versions"]
  script:
    # Drop stale perseus artifacts from a prior run (persistent runner host).
    - rm -f target/debian/perseus*.deb target/debian/perseus*.tar.gz
    - bash crates/perseus/packaging/linux/build_arm64.sh "${CI_COMMIT_TAG#v}"
  artifacts:
    name: "perseus-linux-arm64-${CI_COMMIT_SHORT_SHA}"
    paths:
      - target/debian/*.deb
      - target/debian/*.tar.gz
    expire_in: 30 days

# --- Test gate (tags only) ---
# Answers "did the tagged commit's tests pass?" by polling the tagged
# commit's GitHub check-suite — the only place tests actually run (GitHub
# Actions, .github/workflows/ci.yml). It sits in the `build` stage, not
# `gate`, on purpose: the linux runner runs one job at a time, so a
# gate-stage job here — which can poll for up to 50 minutes — would hold
# the runner and delay every linux build behind it. Anchored on `needs:`
# instead of the stage boundary, it only starts once build:linux,
# build:perseus:linux and check:headless-core have cleared the linux
# runner (~30 min into a normal release, well inside the macOS build's own
# critical path), so its poll costs no wall clock — deploy (stage `deploy`)
# still `needs` it before uploading anything.
gate:tests:
  stage: build
  tags: [linux]
  only: [tags]
  needs:
    - job: build:linux
      artifacts: false
    - job: build:perseus:linux
      artifacts: false
    - job: check:headless-core
      artifacts: false
  timeout: 55m
  script:
    - .gitlab/ci/scripts/github_checks_gate.sh

# --- Shared SSH deploy setup (hidden template job) ---
# Single source of truth for the pinned-host-key ssh-agent dance shared by
# deploy, publish_version and publish:channel-link. before_script starts the
# agent, adds the deploy key, pins ~/.ssh/known_hosts from SSH_KNOWN_HOSTS
# (falling back to an unpinned ssh-keyscan TOFU with a warning — the same
# contract as the docs site's CI), then exports SSH_CMD/SCP_CMD with
# StrictHostKeyChecking=yes; after_script kills the agent. Each consumer
# keeps its own stage/tags/only/needs/variables/script and must set
# DEPLOY_PORT (and, if it uses ${BUILDS_PATH}, that too).
.ssh_deploy_setup:
  before_script:
    - eval $(ssh-agent -s)
    # after_script runs in a FRESH shell with no SSH_AGENT_PID, so `ssh-agent
    # -k` there is a silent no-op and agents pile up on the runner host —
    # stash the pid on disk so after_script can kill it by hand.
    - echo "$SSH_AGENT_PID" > "$CI_PROJECT_DIR/.ssh-agent.pid"
    - chmod 400 "$DEPLOY_SSH_KEY"
    - ssh-add "$DEPLOY_SSH_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Pin the host key from SSH_KNOWN_HOSTS when set (ssh-keyscan -p 40022 <host>),
    # fall back to TOFU with a warning — the same contract as the docs site's CI.
    - |
      if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts; echo "known_hosts pinned"
      else echo "WARNING: SSH_KNOWN_HOSTS unset — unpinned ssh-keyscan (TOFU)"; ssh-keyscan -p ${DEPLOY_PORT} -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null; fi
    - export SSH_CMD="ssh -p ${DEPLOY_PORT} -o StrictHostKeyChecking=yes"
    - export SCP_CMD="scp -P ${DEPLOY_PORT} -o StrictHostKeyChecking=yes"
  after_script:
    - |
      [ -f "$CI_PROJECT_DIR/.ssh-agent.pid" ] && kill "$(cat "$CI_PROJECT_DIR/.ssh-agent.pid")" 2>/dev/null; rm -f "$CI_PROJECT_DIR/.ssh-agent.pid"; true

# --- Deploy to Web Server (tags only) ---
deploy:
  stage: deploy
  extends: .ssh_deploy_setup
  tags:
    - linux
  only:
    - tags
  variables:
    DEPLOY_PORT: "40022"
    BUILDS_PATH: "/var/www/artfrom.space/builds"
  needs:
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
    - job: build:macos
      artifacts: true
    - job: build:perseus:macos
      artifacts: true
    - job: build:perseus:windows
      artifacts: true
    - job: build:perseus:linux
      artifacts: true
    - job: build:perseus:linux-arm64
      artifacts: true
    - job: gate:tests
      artifacts: false
  script:
    - . .gitlab/ci/scripts/artifact_names.sh
    - export VERSION="${CI_COMMIT_TAG#v}"
    # One staging dir laid out exactly like the server: <subdir>/<final name>.
    - rm -rf release_stage && mkdir -p release_stage/windows release_stage/macos release_stage/linux release_stage/perseus
    - cp target/release/bundle/msi/*.msi                          "release_stage/windows/$(artifact_name athenaeum windows x64 msi)"
    - cp target/release/bundle/nsis/*.exe                         "release_stage/windows/$(artifact_name athenaeum windows x64 exe setup)"
    - cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg     "release_stage/macos/$(artifact_name athenaeum macos arm64 dmg)"
    - cp target/x86_64-apple-darwin/release/bundle/dmg/*.dmg      "release_stage/macos/$(artifact_name athenaeum macos x64 dmg)"
    - cp target/release/bundle/appimage/*.AppImage                "release_stage/linux/$(artifact_name athenaeum linux x64 AppImage)"
    - cp target/release/bundle/deb/*.deb                          "release_stage/linux/$(artifact_name athenaeum linux x64 deb)"
    - cp target/aarch64-apple-darwin/release/bundle/perseus-*-macos-arm64.dmg "release_stage/perseus/$(artifact_name perseus macos arm64 dmg)"
    - cp target/x86_64-apple-darwin/release/bundle/perseus-*-macos-x64.dmg    "release_stage/perseus/$(artifact_name perseus macos x64 dmg)"
    - cp crates/perseus/packaging/windows/perseus-*-setup.exe     "release_stage/perseus/$(artifact_name perseus windows x64 exe setup)"
    - cp target/debian/perseus_*_amd64.deb                        "release_stage/perseus/$(artifact_name perseus linux x64 deb)"
    - cp target/debian/perseus-*-linux-amd64.tar.gz               "release_stage/perseus/$(artifact_name perseus linux x64 tar.gz)"
    - cp target/debian/perseus-headless_*_arm64.deb               "release_stage/perseus/$(artifact_name perseus linux arm64 deb)"
    - cp target/debian/perseus-*-linux-arm64.tar.gz               "release_stage/perseus/$(artifact_name perseus linux arm64 tar.gz)"
    # Updater artifacts (in-app updates spec §3.4/§3.5): the macOS app
    # archives and every signature, beside the installers they belong to.
    - cp target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz     "release_stage/macos/$(artifact_name athenaeum macos arm64 app.tar.gz)"
    - cp target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig "release_stage/macos/$(artifact_name athenaeum macos arm64 app.tar.gz).sig"
    - cp target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz      "release_stage/macos/$(artifact_name athenaeum macos x64 app.tar.gz)"
    - cp target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig  "release_stage/macos/$(artifact_name athenaeum macos x64 app.tar.gz).sig"
    - cp target/release/bundle/nsis/*.exe.sig                              "release_stage/windows/$(artifact_name athenaeum windows x64 exe setup).sig"
    - cp target/release/bundle/msi/*.msi.sig                               "release_stage/windows/$(artifact_name athenaeum windows x64 msi).sig"
    - cp target/release/bundle/appimage/*.AppImage.sig                     "release_stage/linux/$(artifact_name athenaeum linux x64 AppImage).sig"
    # Every inventory line must now exist — a glob that matched nothing above fails here, not on the server.
    - |
      while read -r product os arch ext variant subdir filename alias; do
        [ -s "release_stage/$subdir/$filename" ] || { echo "ERROR: missing release_stage/$subdir/$filename"; exit 1; }
      done < <(all_release_artifacts)
    - |
      while read -r product os arch ext variant subdir filename key; do
        [ -s "release_stage/$subdir/$filename" ]     || { echo "ERROR: missing release_stage/$subdir/$filename"; exit 1; }
        [ -s "release_stage/$subdir/$filename.sig" ] || { echo "ERROR: missing release_stage/$subdir/$filename.sig"; exit 1; }
      done < <(updater_artifacts)
    - ${SSH_CMD} ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${BUILDS_PATH}/${CI_COMMIT_TAG}/linux ${BUILDS_PATH}/${CI_COMMIT_TAG}/windows ${BUILDS_PATH}/${CI_COMMIT_TAG}/macos ${BUILDS_PATH}/${CI_COMMIT_TAG}/perseus"
    - for d in windows macos linux perseus; do ${SCP_CMD} release_stage/$d/* ${DEPLOY_USER}@${DEPLOY_HOST}:${BUILDS_PATH}/${CI_COMMIT_TAG}/$d/; done
    # Stable aliases (version-less) + legacy aliases (pre-rename spellings, until v0.7.0).
    # Written via mktemp (outside the checkout) and removed right after use so
    # the job leaves nothing behind in the working tree.
    - |
      ALIAS_CMDS="$(mktemp)"
      { echo "set -e"
        all_release_artifacts | while read -r product os arch ext variant subdir filename alias; do
          echo "ln -sfn '$filename' '${BUILDS_PATH}/${CI_COMMIT_TAG}/$subdir/$alias'"; done
        legacy_alias_pairs | while read -r subdir legacy current; do
          echo "ln -sfn '$current' '${BUILDS_PATH}/${CI_COMMIT_TAG}/$subdir/$legacy'"; done
      } > "$ALIAS_CMDS"
      ${SSH_CMD} ${DEPLOY_USER}@${DEPLOY_HOST} "bash -s" < "$ALIAS_CMDS"
      rm -f "$ALIAS_CMDS"
    # The `builds/latest` / `builds/beta` channel symlink flip does NOT happen
    # here any more — it moved to publish:channel-link (stage announce, after
    # verify): see that job's comment for why.
  artifacts:
    name: "release-sigs-${CI_COMMIT_TAG}"
    paths:
      - release_stage/**/*.sig
    expire_in: 30 days

# --- Docs site publish (tags only) ---
docs:publish:
  stage: publish
  tags: [linux]
  only: [tags]
  needs:
    - job: deploy
      artifacts: false
  script:
    # DOCS_REPO_TOKEN: artfrom-space project access token (Maintainer, write_repository).
    # This job is REQUIRED — the chat announcements link the post it writes.
    # RELEASE_DATE uses the commit's own recorded offset (no `-u`): GNU date on
    # the runner parses CI_COMMIT_TIMESTAMP's ISO-8601 offset directly, so a
    # tag pushed at 01:00-02:00 local (+03:00, this project's normal release
    # time) dates the post/history row that SAME calendar day instead of the
    # UTC-converted previous one.
    - TAG="${CI_COMMIT_TAG}" RELEASE_DATE="$(date -d "${CI_COMMIT_TIMESTAMP}" +%Y-%m-%d)" .gitlab/ci/scripts/docs_publish.sh

# --- Verify (tags only, BLOCKING) ---
# Nothing in `announce` runs until both of these pass: fetch every published
# artifact/manifest/blog post back over the network and prove it is really
# there, then prove the published DMGs are accepted by a real macOS Gatekeeper.
verify:release:
  stage: verify
  # runs on the macOS runner on purpose: the linux runner is one slot shared
  # with the docs site's own pipeline (runner 2 serves both projects) — a
  # linux verify would sit polling for a blog page whose builder is queued
  # behind it. By the time this job is pending, publish:dockerhub:arm64 and
  # verify:macos-gatekeeper are done, so it contends with nothing on the Mac.
  tags: [macos]
  only: [tags]
  needs:
    - job: deploy
      artifacts: false
    - job: docs:publish
      artifacts: false
    - job: publish:dockerhub:manifest
      artifacts: false
      optional: true
  timeout: 30m
  script:
    - .gitlab/ci/scripts/verify_release.sh

# Gatekeeper on the PUBLISHED DMGs, on a Mac, every release: the battery from
# memory project_macos_signing, automated. Proves ruling F5.1 (one notarization
# per DMG) on the real files users download.
verify:macos-gatekeeper:
  stage: verify
  tags: [macos]
  only: [tags]
  needs:
    - job: deploy
      artifacts: false
  script:
    - . .gitlab/ci/scripts/artifact_names.sh
    - export VERSION="${CI_COMMIT_TAG#v}"
    - rm -rf gk && mkdir gk
    - |
      set -e
      for arch in arm64 x64; do
        f="$(artifact_name athenaeum macos "$arch" dmg)"
        curl -fsSL -o "gk/$f" "https://artfrom.space/builds/${CI_COMMIT_TAG}/macos/$f"
        xcrun stapler validate "gk/$f"
        spctl -a -t open --context context:primary-signature -v "gk/$f"
        # The mountpoint must NOT live in the build directory. The runner's
        # builds_dir is on a volume mounted nodev,nosuid,noowners, and macOS
        # refuses to attach a disk image inside one: `hdiutil: attach failed -
        # Permission denied`, which is what failed this job on the first real
        # tag (v0.6.4-beta.1, pipeline 369). Reproduced by hand on the same
        # machine: the identical attach succeeds with a mountpoint under
        # /private/tmp and fails under the builds_dir. TMPDIR is on the boot
        # volume, so mktemp puts it somewhere attachable.
        mnt="$(mktemp -d -t athenaeum-gk-"$arch")"
        hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "gk/$f" >/dev/null
        # Capture spctl's verdict instead of piping it straight to tee: the
        # runner's shell runs with `set -eo pipefail`, so a REJECTED app
        # (spctl exits non-zero) would abort the pipeline right here and the
        # ERROR line below would never run.
        set +e; out=$(spctl -a -t exec -vv "$mnt/Athenaeum.app" 2>&1); rc=$?; set -e
        printf '%s\n' "$out" | tee "gk/spctl-$arch.txt"
        if [ "$rc" -ne 0 ] || ! grep -q "source=Notarized Developer ID" "gk/spctl-$arch.txt"; then
          echo "ERROR: $f: app inside is not accepted as Notarized Developer ID (spctl rc=$rc)"
          hdiutil detach "$mnt" >/dev/null || true
          exit 1
        fi
        hdiutil detach "$mnt" >/dev/null
        echo "ok: $f accepted by Gatekeeper"
      done
  after_script:
    # Detach whatever the script left mounted — it mounts under TMPDIR now, not
    # in the build directory, so this has to look there.
    - for m in "${TMPDIR:-/tmp}"/athenaeum-gk-*; do [ -d "$m" ] && hdiutil detach "$m" >/dev/null 2>&1; rmdir "$m" 2>/dev/null; done; true

# --- Release (only on tags) ---
release:
  stage: announce
  tags:
    - linux
  only:
    - tags
  needs:
    - job: verify:release
      artifacts: false
    - job: verify:macos-gatekeeper
      artifacts: false
  script:
    - .gitlab/ci/scripts/create_gitlab_release.sh

publish_version:
  stage: announce
  extends: .ssh_deploy_setup
  tags:
    - linux
  only:
    - tags
  needs:
    - job: verify:release
      artifacts: false
    - job: verify:macos-gatekeeper
      artifacts: false
  variables:
    DEPLOY_PORT: "40022"
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - |
      if echo "${CI_COMMIT_TAG}" | grep -q '\-beta'; then
        TARGET="version-beta.json"
      else
        TARGET="version.json"
      fi
    - printf '{"version":"%s","download_url":"https://artfrom.space/releases/download"}' "$VERSION" > "$TARGET"
    # Pre-delete: a manually restored copy owned by another user (seen with
    # version-beta.json, astrobureau-owned after the 2026-07-12 wipe incident)
    # makes the scp overwrite fail with EACCES; unlink only needs dir write.
    - ${SSH_CMD} ${DEPLOY_USER}@${DEPLOY_HOST} "rm -f /var/www/artfrom.space/${TARGET}"
    - ${SCP_CMD} "$TARGET" ${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/artfrom.space/"$TARGET"

# --- Channel link (only on tags) ---
# The version-less `builds/latest` / `builds/beta` symlink flip used to run
# inside `deploy`, two stages before verify — which meant a DMG that later
# failed verify:macos-gatekeeper was ALREADY reachable through the permanent
# `builds/latest/...` links a rejected build must never be linkable from. The
# flip moves here instead: the version-less links move only after verify — a
# rejected build never becomes `latest`. verify_release.sh only ever reads
# `builds/<tag>/…` (the frozen, tag-scoped paths `deploy` already wrote), so
# nothing there needs to change.
publish:channel-link:
  stage: announce
  extends: .ssh_deploy_setup
  tags:
    - linux
  only:
    - tags
  needs:
    - job: verify:release
      artifacts: false
    - job: verify:macos-gatekeeper
      artifacts: false
  variables:
    DEPLOY_PORT: "40022"
    BUILDS_PATH: "/var/www/artfrom.space/builds"
  script:
    - |
      if echo "${CI_COMMIT_TAG}" | grep -q '\-beta'; then ${SSH_CMD} ${DEPLOY_USER}@${DEPLOY_HOST} "ln -sfn ${BUILDS_PATH}/${CI_COMMIT_TAG} ${BUILDS_PATH}/beta"
      else ${SSH_CMD} ${DEPLOY_USER}@${DEPLOY_HOST} "ln -sfn ${BUILDS_PATH}/${CI_COMMIT_TAG} ${BUILDS_PATH}/latest"; fi

# --- Chat Notifications (only on tags) ---
# After everything is verified as published (stage `verify`), post the
# contents of RELEASE_NOTES.md to Discord and Telegram. Both are siblings
# under the same verify-pair `needs:` (verify:release + verify:macos-gatekeeper)
# so a failure in one platform does not prevent the other from posting, and
# neither can fire before the release is actually confirmed live.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables; Masked, Protected):
#   - DISCORD_WEBHOOK_URL  (full webhook URL)
#   - TELEGRAM_BOT_TOKEN   (BotFather token, e.g. 1234567:ABC-DEF...)
#   - TELEGRAM_CHAT_ID     (numeric chat id, or @channelusername)
# Each job skips cleanly with a log message if its required variables are unset,
# so the first pipeline after merging this change does not go red while you
# add the secrets.
#
# Spec: docs/superpowers/specs/2026-05-11-release-notes-chat-notifications-design.md

notify:discord:
  stage: announce
  tags:
    - linux
  only:
    - tags
  needs:
    - job: verify:release
      artifacts: false
    - job: verify:macos-gatekeeper
      artifacts: false
  allow_failure: true
  script:
    - .gitlab/ci/scripts/notify_discord.sh

notify:telegram:
  stage: announce
  tags:
    - linux
  only:
    - tags
  needs:
    - job: verify:release
      artifacts: false
    - job: verify:macos-gatekeeper
      artifacts: false
  allow_failure: true
  script:
    - .gitlab/ci/scripts/notify_telegram.sh

# --- Docker Hub Publish (only on tags) ---
# Build the docker/Dockerfile image and push to Docker Hub via NATIVE
# single-arch builds on each architecture's own runner, then merge into one
# multi-arch manifest — replaces the old single qemu-emulated
# `docker buildx build --platform linux/amd64,linux/arm64` job (42-61 min,
# dominated by emulated arm64 Rust compilation):
#   - publish:dockerhub:amd64    (linux runner)  -> pushes ${IMAGE}:${VERSION}-amd64
#   - publish:dockerhub:arm64    (macOS runner)  -> pushes ${IMAGE}:${VERSION}-arm64
#   - publish:dockerhub:manifest (linux runner)  -> merges both arch tags into
#     ${IMAGE}:${VERSION} + ${IMAGE}:${CHANNEL_TAG} via
#     `docker buildx imagetools create` (index-only, no rebuild/re-push of
#     image layers).
# All three now hang off `deploy` (stage `publish`, `needs: [{job: deploy,
# artifacts: false}]`) instead of the old release job — they start as soon
# as the installers are uploaded, in parallel with docs:publish, well before
# the GitLab Release exists. `allow_failure: true` stays on all three: a
# Docker Hub outage must not fail this stage by itself. It's `verify:release`
# (stage `verify`) that turns a missing/failed Docker Hub publish into a
# pipeline-blocking failure — nothing in `announce` fires until verify
# confirms the manifest tag is really there. The manifest job additionally
# `needs` both arch jobs, with arm64 `optional: true` so a failed/absent
# arm64 build never blocks an amd64-only publish.
#
# Tag derivation (mirrors the retired .github/workflows/docker.yml):
#   v0.2.0           -> :0.2.0 + :latest
#   v0.2.1-beta.1    -> :0.2.1-beta.1 + :beta
# Anything else with a non-"-beta" suffix (-rc, -alpha) routes to :latest;
# tag those carefully or widen the grep in publish:dockerhub:manifest.
#
# The image is stamped with OCI labels (org.opencontainers.image.version /
# .revision / .created / .source / .title) so `docker inspect` can always
# answer "what version is this?" even for the rolling :latest/:beta tags.
# On top of that, publish:dockerhub:manifest calls
# .gitlab/ci/scripts/update_dockerhub_description.sh, which rewrites a
# managed table in the Hub repo's description mapping :latest/:beta to the
# version/git-tag/timestamp just published — hub.docker.com has no built-in
# way to show what a rolling tag currently points at otherwise. That script
# soft-fails (warns + exits 0) on any Docker Hub API error; see its header.
# The arch-tag-check + imagetools-create + description-call logic all lives
# in .gitlab/ci/scripts/dockerhub_merge_manifest.sh so it's independently
# testable (see .gitlab/ci/scripts/test/run_tests.sh).
#
# Required CI/CD variables (Settings -> CI/CD -> Variables; Masked, Protected):
#   - DOCKERHUB_USERNAME  (Docker Hub username, e.g. vsharifov)
#   - DOCKERHUB_TOKEN     (Docker Hub access token; Read, Write, Delete)
# All three jobs skip cleanly with a log message if either is unset.
#
# Runner host prereqs:
#   linux (amd64 + manifest jobs, one-time, requires sudo):
#     sudo apt-get install -y docker.io docker-buildx
#     sudo usermod -aG docker gitlab-runner && sudo systemctl restart gitlab-runner
#   macOS (arm64 job): OrbStack provides the Docker engine and must be RUNNING
#     (start-at-login is enabled on the runner host: `orb config set
#     app.start_at_login true`) — this is a GUI-session runner (see MEMORY.md
#     project_macos_signing for the LaunchAgent setup it shares with the
#     notarization runner). docker CLI comes from Homebrew; buildx resolves via
#     ~/.docker/cli-plugins to OrbStack's plugin. If the engine is down, the
#     job's preflight fails loudly (allow_failure keeps it a soft/yellow
#     failure, but it must never silently no-op).
#   qemu-user-static / tonistiigi/binfmt is NOT needed by any of the three
#     jobs above — each builds natively for its own runner's architecture.
#     It's only relevant to the legacy single-job multi-platform
#     `docker buildx build --platform linux/amd64,linux/arm64` path this
#     replaces, which required emulation for the non-native arch.

publish:dockerhub:amd64:
  stage: publish
  tags:
    - linux
  only:
    - tags
  needs:
    - job: deploy
      artifacts: false
  allow_failure: true
  variables:
    IMAGE: "docker.io/vsharifov/athenaeum"
  before_script:
    # buildx must be pre-installed on the runner host (see header above).
    - |
      missing=()
      command -v docker >/dev/null || missing+=(docker)
      docker buildx version >/dev/null 2>&1 || missing+=(docker-buildx)
      if [ ${#missing[@]} -gt 0 ]; then
        echo "ERROR: missing build deps on runner: ${missing[*]}"
        echo "Run on the runner host:"
        echo "  sudo apt-get install -y docker.io docker-buildx"
        echo "  sudo usermod -aG docker gitlab-runner && sudo systemctl restart gitlab-runner"
        exit 1
      fi
  script:
    - |
      if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
        echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set; skipping Docker Hub publish."
        exit 0
      fi
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "Publishing ${IMAGE}:${VERSION}-amd64 (native linux/amd64 build)"
    - echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin docker.io
    # Idempotent buildx builder bootstrap.
    - docker buildx inspect athenaeum-builder >/dev/null 2>&1 || docker buildx create --name athenaeum-builder --use
    - docker buildx use athenaeum-builder
    - |
      docker buildx build \
        --platform linux/amd64 \
        --file docker/Dockerfile \
        --tag "${IMAGE}:${VERSION}-amd64" \
        --label "org.opencontainers.image.title=Athenaeum" \
        --label "org.opencontainers.image.description=Astrophotography image management and FITS/XISF catalog" \
        --label "org.opencontainers.image.version=${VERSION}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --push \
        .
  after_script:
    - docker logout docker.io 2>/dev/null || true

publish:dockerhub:arm64:
  stage: publish
  tags:
    - macos
  only:
    - tags
  needs:
    - job: deploy
      artifacts: false
  allow_failure: true
  variables:
    IMAGE: "docker.io/vsharifov/athenaeum"
  before_script:
    # Native arm64 build on Apple Silicon (OrbStack engine). Unlike the linux
    # job, absence of docker/buildx OR a stopped daemon (OrbStack not
    # running on this GUI-session runner) must surface as a visible failed
    # (yellow, allow_failure) job — NEVER exit 0 here, or a missing arm64
    # build silently degrades every release to amd64-only with no signal.
    - |
      if ! command -v docker >/dev/null 2>&1; then
        echo "ERROR: docker CLI not found on this runner host."
        exit 1
      fi
      if ! docker info >/dev/null 2>&1; then
        echo "ERROR: Docker daemon not reachable — is OrbStack running on this runner host?"
        exit 1
      fi
      if ! docker buildx version >/dev/null 2>&1; then
        echo "ERROR: docker buildx not available."
        exit 1
      fi
  script:
    - |
      if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
        echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set; skipping Docker Hub publish."
        exit 0
      fi
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "Publishing ${IMAGE}:${VERSION}-arm64 (native linux/arm64 build)"
    - echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin docker.io
    # Idempotent buildx builder bootstrap.
    - docker buildx inspect athenaeum-builder >/dev/null 2>&1 || docker buildx create --name athenaeum-builder --use
    - docker buildx use athenaeum-builder
    - |
      docker buildx build \
        --platform linux/arm64 \
        --file docker/Dockerfile \
        --tag "${IMAGE}:${VERSION}-arm64" \
        --label "org.opencontainers.image.title=Athenaeum" \
        --label "org.opencontainers.image.description=Astrophotography image management and FITS/XISF catalog" \
        --label "org.opencontainers.image.version=${VERSION}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --push \
        .
  after_script:
    - docker logout docker.io 2>/dev/null || true

publish:dockerhub:manifest:
  stage: publish
  tags:
    - linux
  only:
    - tags
  needs:
    - job: deploy
      artifacts: false
    - job: publish:dockerhub:amd64
      artifacts: false
    - job: publish:dockerhub:arm64
      artifacts: false
      optional: true
  allow_failure: true
  variables:
    IMAGE: "docker.io/vsharifov/athenaeum"
  before_script:
    # buildx must be pre-installed on the runner host (see header above).
    - |
      missing=()
      command -v docker >/dev/null || missing+=(docker)
      docker buildx version >/dev/null 2>&1 || missing+=(docker-buildx)
      if [ ${#missing[@]} -gt 0 ]; then
        echo "ERROR: missing build deps on runner: ${missing[*]}"
        echo "Run on the runner host:"
        echo "  sudo apt-get install -y docker.io docker-buildx"
        echo "  sudo usermod -aG docker gitlab-runner && sudo systemctl restart gitlab-runner"
        exit 1
      fi
  script:
    - |
      if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
        echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set; skipping Docker Hub manifest merge."
        exit 0
      fi
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      if echo "${CI_COMMIT_TAG}" | grep -q '\-beta'; then
        CHANNEL_TAG="beta"
      else
        CHANNEL_TAG="latest"
      fi
    - IMAGE="${IMAGE}" VERSION="${VERSION}" CHANNEL_TAG="${CHANNEL_TAG}" .gitlab/ci/scripts/dockerhub_merge_manifest.sh
  after_script:
    - docker logout docker.io 2>/dev/null || true
