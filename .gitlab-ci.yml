stages:
  - build
  - release

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  npm_config_cache: "${CI_PROJECT_DIR}/.npm"

# --- Windows Build ---
build:windows:
  stage: build
  tags:
    - windows
  only:
    - main
  cache:
    key: "${CI_COMMIT_REF_SLUG}-windows"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
      - .npm/
      - node_modules/
  script:
    - npm ci
    - npm run tauri build -- --target x86_64-pc-windows-gnu
  artifacts:
    name: "athenaeum-windows-${CI_COMMIT_SHORT_SHA}"
    paths:
      - src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
      - src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
    expire_in: 30 days

# --- Release (only on tags) ---
release:
  stage: release
  tags:
    - windows
  only:
    - tags
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: "${CI_COMMIT_TAG}"
    name: "Athenaeum ${CI_COMMIT_TAG}"
    description: "Release ${CI_COMMIT_TAG}"
    assets:
      links:
        - name: "Windows Installer (MSI)"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/src-tauri/target/release/bundle/msi/Athenaeum_${CI_COMMIT_TAG}_x64_en-US.msi"
        - name: "Windows Installer (EXE)"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/src-tauri/target/release/bundle/nsis/Athenaeum_${CI_COMMIT_TAG}_x64-setup.exe"
  needs:
    - job: build:windows
      artifacts: true
