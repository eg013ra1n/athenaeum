[workspace]
resolver = "2"
members = [
    "crates/athenaeum-core",
    "crates/athenaeum-tauri",
    "crates/athenaeum-web",
    "crates/catalog-builder",
    "crates/log-mcp",
    "crates/perseus",
    "rustafits",
    "solvemyastro",
]
[profile.dev.package."*"]
opt-level = 2

# Workspace members aren't covered by package."*" above.
[profile.dev.package.athenaeum-core]
opt-level = 2

# solvemyastro is the hot numeric path (gnomonic projection, quad matching,
# per-trial rayon spiral, cone reads, nalgebra SIP/affine lsq). As a
# workspace member it is NOT covered by package."*"; without this it builds
# at opt-level 0 in `tauri dev`, making plate solving ~an order of magnitude
# slower. Highest opt-level since it is the tightest float code in the app.
[profile.dev.package.solvemyastro]
opt-level = 3

# rustafits is a workspace member too: the FITS / XISF reader, the CFA green-site
# helpers the Analysis path uses, and the render pipeline run at opt-level 0 in
# `tauri dev` without this.
[profile.dev.package.rustafits]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
