[package]
name = "jpeg-encode"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pure-Rust libjpeg-turbo reimplementation: NEON on aarch64, AVX2/SSE2 on
# x86_64, scalar fallback elsewhere. Same crate AND same exact version the
# rustafits submodule pins, so cargo unifies it and the build carries one JPEG
# encoder instead of two.
#
# Replaces the `turbojpeg` C binding at comparable speed but with no
# cmake/nasm/C toolchain, which is what makes `cargo check -p athenaeum-core
# --no-default-features` (check:headless-core) and the arm64 Perseus container
# build with nothing but the Rust toolchain — this crate is an UNCONDITIONAL
# dep of athenaeum-core, so whatever it pulls, every headless consumer pulls.
#
# Pinned exactly, matching rustafits: the crate is young and pre-1.0, and the
# encoder defaults that keep output stable (IsLow DCT, Annex-K quant/Huffman
# tables, no restart interval) are internal to `compress`, not part of its
# signature — a minor bump could change any of them silently, so it gets
# reviewed rather than picked up. 0.8.0 is the first release carrying the
# 4:2:0 trailing-MCU fix (see rustafits docs/libjpeg-turbo-rs-issue.md).
#
# NOTE: the `simd` feature is ON by default — never pass
# `default-features = false` here or the NEON/AVX2 paths silently go scalar.
libjpeg-turbo-rs = "=0.8.0"
