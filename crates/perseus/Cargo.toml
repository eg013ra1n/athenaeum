[package]
name = "perseus"
version = "0.5.0-beta.1"
description = "Perseus — headless capture-node agent that watches a capture directory and syncs new frames to a paired primary over iroh"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

# Library + binary: the library exposes the agent internals (config, watcher,
# stability tracker, run/Agent) so the integration test in tests/ — a separate
# crate that can only see the public API — can wire an in-process transport.
[lib]
name = "perseus"
path = "src/lib.rs"

[[bin]]
name = "perseus"
path = "src/main.rs"

[features]
# FITS/XISF preview rendering for the library browser (0.5.1 T6). ON by default,
# so every packaged build ships it — including the headless ones, which is the
# whole point (an operator browsing a Pi's capture folder wants to SEE the frame
# before sending it). rustafits's JPEG encoder is pure Rust, so this costs
# compile time and binary size, never a C toolchain.
#
# `--no-default-features` drops it; `GET /api/library/preview` then answers a
# `404 preview not built` stub so the router shape stays identical either way.
# NOTE for packagers: `--no-default-features` must be paired with
# `--features preview` unless a genuinely preview-less binary is wanted.
default = ["preview"]
preview = ["dep:rustafits"]
# GUI tray mode. Off by default so headless builds (RPi, check:headless-core)
# pull zero GUI deps. Desktop packages build with `--features tray`.
# Deliberately NOT in `default`: adding `preview` to `default` above must not
# quietly turn the tray on anywhere.
tray = ["dep:tray-icon", "dep:tao", "dep:open", "dep:auto-launch"]

[dependencies]
# Headless dependency on the shared library: default-features = false omits the
# `render` (rustafits) and `solver` (solvemyastro) native-heavy features. Perseus
# needs only the ungated modules: sharing (iroh transport + loopback), package,
# sync, fits_parser, fits_writer, models.
athenaeum-core = { path = "../athenaeum-core", default-features = false }
# FITS/XISF → auto-stretched 8-bit RGB for the library preview (feature
# `preview`). A DIRECT path dep on the submodule rather than athenaeum-core's
# `render` feature: `render` also switches on analysis/integration/flat-analysis,
# none of which a capture node has any use for. Its JPEG encoder is pure Rust
# (no cmake/nasm), so this stays cross-compilable to arm64 with nothing but the
# Rust toolchain. The lib target is named `astroimage` (rustafits's `[lib] name`),
# so `preview.rs` says `use astroimage::…`.
rustafits = { path = "../../rustafits", optional = true }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Platform config/data directories for the first-run default config path
# (~/Library/Application Support, %APPDATA%, ~/.config). Major 6 already resolves
# in the workspace lock (pulled in transitively by Tauri), so cargo unifies it.
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Comment-/layout-preserving edits of the `[retention]` table for the web
# settings page (config_edit.rs). Only the whitelisted keys are rewritten; the
# file is re-parsed + validated and atomically replaced. 0.23.7 already resolves
# in the workspace lock.
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
notify = "8"
# "net" is required for the embedded web status page's `tokio::net::TcpListener`
# (task 9). It is already enabled transitively by iroh, but Perseus uses the API
# directly, so it declares the feature explicitly rather than relying on
# workspace feature-unification.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync", "net"] }
tracing = "0.1"
# Embedded web status page (task 9): axum 0.8 router + bearer-auth middleware +
# read-only status/sent/history endpoints. Pinned to the same major the web
# crate uses so cargo unifies the dependency.
axum = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# perseus_seen: Perseus's own store-aware dedup table, opened as a second
# connection into the SAME `<data_dir>/perseus.db` file athenaeum-core's
# StandaloneSyncStore uses (safe: WAL mode, an explicitly supported SQLite
# pattern for multiple connections to one file). Version pinned to match
# athenaeum-core's rusqlite so cargo unifies the dependency.
rusqlite = { version = "0.40", features = ["bundled"] }
# Timestamp formatting for perseus_seen.enqueued_at; version matches
# athenaeum-core's chrono so cargo unifies the dependency.
chrono = "0.4"
# iroh types named directly at the transport-wiring seam (run.rs): RelayMode for
# IrohTransport::new, EndpointTicket to derive the peer NodeId from the pairing
# ticket. Pinned to the exact versions athenaeum-core uses so cargo unifies them.
iroh = "=1.0.3"
iroh-tickets = "=1.0.0"
# Tray mode (feature `tray`, off by default). Versions pinned to the workspace
# lock — tray-icon/tao/open already resolve there transitively via Tauri, so
# cargo unifies them; auto-launch is new to the lock (start-at-login toggle).
tray-icon = { version = "0.24", optional = true }
tao = { version = "0.35", optional = true }
open = { version = "5.4", optional = true }
auto-launch = { version = "0.6", optional = true }
# Unix `statvfs` for the retention disk-usage probe (disk_pct policy) and the
# per-volume free-space probe (diskspace.rs). Already in the workspace lock as a
# transitive dep; named here so run.rs can call it directly. On non-unix the
# retention probe is a safe stub (0% → never triggers deletion).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows free-space probe (diskspace.rs): `GetDiskFreeSpaceExW`. Windows-only so
# unix/RPi builds pull nothing extra; 0.61 already resolves in the workspace lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
# DST arms of the scheduler math (schedule.rs, 0.5.1 T12): a REAL IANA zone
# (America/New_York) so the spring-forward gap and fall-back fold are the ones the
# tz database defines, not ones a hand-rolled fake TimeZone invented. Dev-only —
# the agent itself schedules in `chrono::Local` and ships no tz database.
chrono-tz = "0.10"
# Mock HTTP hub for the account login / pairing-resolution tests (task M1).
wiremock = "0.6"
# `ServiceExt::oneshot` to drive the web router in-process (no bound socket) in
# the web.rs handler tests. `util` is the only feature needed. Version matches
# the web crate so cargo unifies the dependency.
tower = { version = "0.5", features = ["util"] }

# Debian packaging (cargo-deb). The parent table is the desktop package (tray UI +
# GUI runtime deps); `variants.headless` overrides it for RPi/servers with no GUI.
# Build desktop: `cargo deb -- -p perseus` from crates/perseus.
# Build headless: `cargo deb --variant headless --no-default-features --features preview -- -p perseus`.
#
# Both variants must ship the `preview` feature. The desktop build gets it from
# `default`; the headless build passes `--no-default-features`, so it names
# `preview` explicitly in its own `features` array below — that array is the only
# thing keeping the RPi package's `/api/library/preview` from being the 404 stub.
[package.metadata.deb]
maintainer = "Vilen Sharifov <vilen.sharifov@gmail.com>"
copyright = "2026, Vilen Sharifov"
extended-description = "Headless capture-node agent for Athenaeum: watches capture folders and syncs new FITS/XISF frames to your primary machine. Tray UI + embedded web page."
section = "science"
priority = "optional"
features = ["tray"]
depends = "$auto, libgtk-3-0, libayatana-appindicator3-1 | libappindicator3-1"
assets = [
  ["target/release/perseus", "usr/bin/", "755"],
  ["packaging/linux/perseus.desktop", "usr/share/applications/", "644"],
  ["packaging/linux/perseus.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
  ["packaging/linux/perseus.service", "usr/share/doc/perseus/examples/", "644"],
]

# Headless variant (RPi/servers): no tray feature, no GUI deps — but `preview`
# stays on. It is listed explicitly because this variant is built with
# `--no-default-features`, which would otherwise strip it out of `default`.
[package.metadata.deb.variants.headless]
features = ["preview"]
depends = "$auto"
assets = [
  ["target/release/perseus", "usr/bin/", "755"],
  ["packaging/linux/perseus.service", "usr/share/doc/perseus/examples/", "644"],
]
