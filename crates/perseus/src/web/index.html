<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perseus — capture node</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Perseus</h1>
      <span class="sub">headless capture node</span>
      <span class="conn-dot" id="connDot"></span>
      <span class="sub" id="conn"></span>
      <!-- Free space per capture/data volume, filled by refreshStatus() from
           /api/status `volumes`. Empty while offline or unprobeable. -->
      <span class="vol-chips" id="volChips" aria-label="Free disk space"></span>
      <!-- The armed scheduled send (0.5.1 T14), from /api/status
           `nextScheduledSend`. Present ONLY in scheduled mode with a live
           deadline — hidden in every other case, so it can never show a stale
           or invented time. -->
      <span class="sub next-send" id="nextSend" hidden></span>
      <nav class="tabs" role="tablist" aria-label="Perseus sections">
        <button class="tab active" id="tabBtnTransfers" data-tab="transfers" role="tab">Transfers</button>
        <button class="tab" id="tabBtnLibrary" data-tab="library" role="tab">Library</button>
        <button class="tab" id="tabBtnSettings" data-tab="settings" role="tab">Settings</button>
      </nav>
    </header>

    <!-- Tab panels. app.js renders each tab's sections into these empty <main>s
         on boot (and inserts the global lifecycle banner just below the header).
         The Library panel is the capture-root browser (0.5.1 T5): it is filled
         on demand, never by the 2 s poll. -->
    <main id="tab-transfers"></main>
    <main id="tab-library" hidden></main>
    <main id="tab-settings" hidden></main>

    <!-- Frame preview overlay (0.5.1 T7), the pre-blink look at one frame. It
         sits OUTSIDE the tab panels on purpose: a fixed overlay nested in a
         panel would be hidden along with its tab while still holding the
         document-level key listener. app.js fills it on open and empties it on
         close; `hidden` is the only visibility switch (see the [hidden] rule). -->
    <div id="libPreview" class="lib-pv-overlay" hidden></div>

    <!-- Library action dialogs (0.5.1 T10): the Send-to picker and the delete
         confirm. Same body-level placement, and the same reason, as the preview
         overlay above — a fixed overlay nested in the Library panel would be
         hidden along with its tab while still holding the document-level Escape
         listener. app.js fills it on open and empties it on close. -->
    <div id="libDialog" class="lib-dlg-overlay" hidden></div>

    <script src="/app.js"></script>
  </body>
</html>
