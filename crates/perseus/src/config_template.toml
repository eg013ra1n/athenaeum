# Perseus configuration — created automatically on first run.
# The web page (tray icon → Open Web UI) can edit capture folders and
# retention; this file can also be edited by hand (restart to apply).

# Where Perseus keeps its database, logs, staged packages, and credentials.
data_dir = '{data_dir}'
mode = "auto"            # "auto" (send each capture), "manual" (queue; send from the web page)
                         # or "scheduled" (queue; send at schedule_times below)
auto_quiet_secs = 60     # auto: flush after N seconds with no new file

# scheduled mode: wall-clock send times in THIS device's local time, "HH:MM".
# Capture all night, ship once when the uplink is free. Required (at least one
# entry) when mode = "scheduled"; ignored in the other modes.
# INTERIM: set "scheduled" HERE, not on the web page. The page has no scheduler
# controls yet — it shows "scheduled" as Auto, hides its "Send N pending now"
# button, and saving that panel rewrites mode back to "auto". The manual flush
# itself (POST /api/send-now) does work in scheduled mode; only the button that
# calls it is hidden. Both gaps close when the scheduler settings page lands.
# schedule_times = ["06:00", "14:30"]
# If a send time passes while Perseus is not running, send once at startup
# instead of waiting for the next one. One catch-up send, never one per missed
# time. Default true.
# schedule_catchup = true

# Optional friendly name for this node in your account (defaults to the hostname).
# device_name = "Observatory Pi"

# max_upload_mbps = 8   # cap sync upload speed (decimal MB/s); 0 or absent = unlimited. Keeps SSH usable during big syncs.

# Folders watched for new FITS/XISF captures. Add them from the web page,
# or here: capture_dirs = ["/path/to/captures"]
capture_dirs = []

# Devices in your account to send captures to, by device name or id. Perseus is
# send-only; add at least one. Set from the web page, or here: targets = ["Studio Mac"]
targets = []

# Hub account sign-in. Sign in from the web page, or run `perseus login`.
[account]

[retention]
policy = "keep_everything"
dry_run = true
