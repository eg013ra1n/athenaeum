[package]
name = "athenaeum-web"
version = "0.2.2-beta.1"
description = "Athenaeum web backend - Axum server for Docker/server deployment"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "athenaeum-web"
path = "src/main.rs"

[dependencies]
athenaeum-core = { path = "../athenaeum-core" }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
rayon = "1"
# Required for rusqlite::params! in route handlers that run inline SQL queries
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
base64 = "0.22"
solvemyastro = { path = "../../solvemyastro" }
# Already in Cargo.lock transitively (axum depends on percent-encoding
# "2.1", resolving to 2.3.2) — declared explicitly so routes/auth.rs can
# percent-decode the SSE ?api_key= query param without pulling in a second
# version.
percent-encoding = "2.1"
tracing = "0.1"

[dev-dependencies]
# ServiceExt::oneshot for router-level middleware tests (see routes/auth.rs).
tower = { version = "0.5", features = ["util"] }
# Temp DB + temp allowed-dir fixtures for route-level tests (see
# routes/scan_roots.rs). Same version as athenaeum-core's dev-dependency.
tempfile = "3"
