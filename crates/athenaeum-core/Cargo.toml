[package]
name = "athenaeum-core"
version = "0.5.0-beta.1"
description = "Athenaeum core library - shared business logic for desktop and web"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
r2d2 = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
walkdir = "2"
anyhow = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
quick-xml = "0.36"
uuid = { version = "1", features = ["v4"] }
# Optional submodule path deps (pull turbojpeg/nasm/cmake native builds). Gated
# behind the `render`/`solver` features so headless consumers (e.g. Perseus) can
# depend on athenaeum-core with `default-features = false` and skip them.
rustafits = { path = "../../rustafits", features = ["debug-pipeline"], optional = true }
# Standalone plate solver (clean-room quad-matching implementation). Path dep like
# rustafits; Phase 3 adapter calls solvemyastro::solve / build_cache.
solvemyastro = { path = "../../solvemyastro", optional = true }
sha2 = "0.10"
md-5 = "0.10"
jpeg-encode = { path = "../jpeg-encode" }
memmap2 = "0.9"
byteorder = "1"
cdshealpix = "0.9"
flate2 = "1.0"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
# OS keychain for the hub device-token (task B4). Only the apple/windows native
# stores are enabled — no secret-service/dbus backend, so the Linux (web/Docker)
# and headless builds compile without any system D-Bus lib and simply use the
# file-0600 fallback in `account::token_store` (see that module). The token is
# NEVER written to logs or DB.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "fs", "io-util"] }
# Trait-object async methods for the transport-agnostic SharingTransport (sync
# feature). Sanctioned mechanism per the Stage I sync plan; ungated so the
# headless build (`--no-default-features`) includes the sharing module.
async-trait = "0.1"
# iroh peer-to-peer transport for Stage I personal sync (task A5). Pinned to the
# current 1.x line; iroh-blobs 0.103 pairs with iroh ^1.0. NON-optional and
# ungated so the headless (`--no-default-features`) build still carries the
# `sharing::iroh` transport (Perseus needs it). Default features keep the
# pure-Rust `tls-ring` crypto backend (no cmake/aws-lc-rs) — ARM-friendly, pulls
# no rustafits/solver/native-heavy deps.
iroh = "=1.0.3"
iroh-blobs = "=0.103.0"
# Addressing ticket (EndpointTicket) used as the out-of-band pairing_ticket;
# pinned to iroh's 1.x ticket crate. Transitive under iroh-blobs, named directly
# so the transport can build/parse pairing tickets.
iroh-tickets = "=1.0.0"
# StreamExt for iroh's per-connection `PathEventStream` (connection-path NAT
# diagnostics). This is iroh's own stream-consumption crate (0.3.2 already in the
# tree transitively — single version, no duplicate); `iroh` does not re-export a
# StreamExt, so it is named directly here to poll the path-change watcher.
n0-future = "0.3"
# Cross-platform advisory file lock on the device-key file (iroh hardening C1/I4):
# a process-lifetime lock so a second install started from a COPIED device key
# fails loudly at node bind instead of silently dueling on the relay. Backed by
# `rustix` on unix (single version 1.1.2 already in the tree — no duplicate) and
# a native handle on Windows.
fd-lock = "4"
# ed25519 verification of hub-signed membership snapshots. MUST match the
# version iroh 1.0.3 already carries transitively (one crate version in the
# tree — owner rule): iroh 1.0.3 depends on `ed25519-dalek >=3.0.0-rc.0, <4.0.0`,
# which resolves to the 3.0.0 stable release. Check
# `grep -A1 'name = "ed25519-dalek"' Cargo.lock` and pin exactly that.
ed25519-dalek = "3.0.0"
# postcard wire encoding for the announce/ack control protocol (bidirectional QUIC stream).
postcard = { version = "1", features = ["use-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# no-serde-warnings: ts-rs cannot parse type-irrelevant serde attrs
# (deserialize_with, skip_serializing_if, alias) and warns on every build;
# the generated-output diff in tests/ts_contract.rs is the real guard.
ts-rs = { version = "10", features = ["chrono-impl", "no-serde-warnings"] }
base64 = "0.22"
# Cross-platform OS hostname for the default device name (Sync 2C). Small,
# dependency-light; the name is cosmetic (renamable via the hub) so this only
# needs a best-effort read, with a synthetic `<prefix>-<short6>` fallback.
hostname = "0.4"
# Unix statvfs for the retention disk-usage probe (task M4). Already in the build
# graph transitively (rusqlite/tokio); named directly, single 0.2 version, so the
# `disk_pct` retention policy can measure free space without a new dependency tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# `render` pulls the rustafits image pipeline; `solver` pulls the plate-solver.
# Default keeps today's full behavior for the desktop/web builds. Headless
# consumers build with `--no-default-features` to omit both native-heavy deps.
default = ["render", "solver"]
render = ["dep:rustafits"]
solver = ["dep:solvemyastro"]

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.25", default-features = false }
# Mock HTTP server for the account hub-client tests (task B4).
wiremock = "0.6"
