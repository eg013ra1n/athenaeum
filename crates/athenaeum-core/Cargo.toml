[package]
name = "athenaeum-core"
version = "0.5.5"
description = "Athenaeum core library - shared business logic for desktop and web"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
r2d2 = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
walkdir = "2"
anyhow = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
quick-xml = "0.41"
uuid = { version = "1", features = ["v4"] }
# Optional submodule path deps. Gated behind the `render`/`solver` features so
# headless consumers (e.g. Perseus) can depend on athenaeum-core with
# `default-features = false` and skip them. Neither pulls a C toolchain any
# more — rustafits's JPEG encoder moved to pure-Rust libjpeg-turbo-rs — so the
# gate is now about compile time, binary size and unused subsystems, not about
# cmake/nasm.
rustafits = { path = "../../rustafits", features = ["debug-pipeline"], optional = true }
# Standalone plate solver (clean-room quad-matching implementation). Path dep like
# rustafits; Phase 3 adapter calls solvemyastro::solve / build_cache.
solvemyastro = { path = "../../solvemyastro", optional = true }
sha2 = "0.11"
md-5 = "0.11"
byteorder = "1"
cdshealpix = "0.9"
flate2 = "1.0"
zip = { version = "8", default-features = false, features = ["deflate", "time"] }
# TLS backend is selected EXPLICITLY. reqwest 0.13 changed `default-tls` to
# rustls-with-aws-lc-rs, which would drag aws-lc-sys (cmake + nasm) into every
# build — the native dep the iroh stack deliberately avoids. `native-tls-no-alpn`
# + charset/http2/system-proxy stands in for reqwest 0.12's default set with the
# TLS backend held where it was (schannel / Security.framework / openssl, already
# in the tree). blocking/json/form/query are this crate's own opt-ins on top —
# `query` because 0.13 moved `RequestBuilder::query` behind a feature that 0.12
# compiled unconditionally, so without it the 0.12 API surface is not fully
# restored. iroh's own clients are unaffected by the shared default: it always
# calls `tls_backend_preconfigured()` with its ring rustls config.
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls-no-alpn",
    "charset",
    "http2",
    "system-proxy",
    "blocking",
    "json",
    "form",
    "query",
] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "fs", "io-util"] }
# Trait-object async methods for the transport-agnostic SharingTransport (sync
# feature). Sanctioned mechanism per the Stage I sync plan; ungated so the
# headless build (`--no-default-features`) includes the sharing module.
async-trait = "0.1"
# iroh peer-to-peer transport for Stage I personal sync (task A5). Pinned to the
# current 1.x line; iroh-blobs 0.103 pairs with iroh ^1.0. NON-optional and
# ungated so the headless (`--no-default-features`) build still carries the
# `sharing::iroh` transport (Perseus needs it). Default features keep the
# pure-Rust `tls-ring` crypto backend (no cmake/aws-lc-rs) — ARM-friendly, pulls
# no rustafits/solver/native-heavy deps.
iroh = "=1.0.3"
iroh-blobs = "=0.103.0"
# Addressing ticket (EndpointTicket) used as the out-of-band pairing_ticket;
# pinned to iroh's 1.x ticket crate. Transitive under iroh-blobs, named directly
# so the transport can build/parse pairing tickets.
iroh-tickets = "=1.0.0"
# StreamExt for iroh's per-connection `PathEventStream` (connection-path NAT
# diagnostics). This is iroh's own stream-consumption crate (0.3.2 already in the
# tree transitively — single version, no duplicate); `iroh` does not re-export a
# StreamExt, so it is named directly here to poll the path-change watcher.
n0-future = "0.3"
# Cross-platform advisory file lock on the device-key file (iroh hardening C1/I4):
# a process-lifetime lock so a second install started from a COPIED device key
# fails loudly at node bind instead of silently dueling on the relay. Backed by
# `rustix` on unix (single version 1.1.2 already in the tree — no duplicate) and
# a native handle on Windows.
fd-lock = "4"
# ed25519 verification of hub-signed membership snapshots. MUST match the
# version iroh 1.0.3 already carries transitively (one crate version in the
# tree — owner rule): iroh 1.0.3 depends on `ed25519-dalek >=3.0.0-rc.0, <4.0.0`,
# which resolves to the 3.0.0 stable release. Check
# `grep -A1 'name = "ed25519-dalek"' Cargo.lock` and pin exactly that.
ed25519-dalek = "3.0.0"
# postcard wire encoding for the announce/ack control protocol (bidirectional QUIC stream).
postcard = { version = "1", features = ["use-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# no-serde-warnings: ts-rs cannot parse type-irrelevant serde attrs
# (deserialize_with, skip_serializing_if, alias) and warns on every build;
# the generated-output diff in tests/ts_contract.rs is the real guard.
ts-rs = { version = "12", features = ["chrono-impl", "no-serde-warnings"] }
base64 = "0.23"
# Cross-platform OS hostname for the default device name (Sync 2C). Small,
# dependency-light; the name is cosmetic (renamable via the hub) so this only
# needs a best-effort read, with a synthetic `<prefix>-<short6>` fallback.
hostname = "0.4"
# Copy-on-write file clone for package staging (`package::stage_payload`): APFS /
# Btrfs / XFS / ReFS clone a payload in constant time and zero extra disk, so
# preparing a transfer costs one read (the hash of the clone) instead of a full
# copy. Already in the build graph transitively under iroh-blobs — single 0.1.30
# version, no new dependency tree. Falls back to the stream copy+hash whenever
# the filesystem cannot clone (ext4, exFAT, cross-device), which is a plain
# `Err` from `reflink`, never a panic.
reflink-copy = "0.1"
# Unix statvfs for the retention disk-usage probe (task M4). Already in the build
# graph transitively (rusqlite/tokio); named directly, single 0.2 version, so the
# `disk_pct` retention policy can measure free space without a new dependency tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# OS keychain for the hub device-token (task B4). keyring 4 is a thin shim: the
# platform stores moved into their own crates (`apple-native-keyring-store` /
# `windows-native-keyring-store`) over a shared `keyring-core`, and the `v1`
# feature is the compatibility surface that keeps v3's `Entry::new(service,
# user)` API and picks exactly those two native stores.
#
# TARGET-SCOPED ON PURPOSE: `v1` also enables `zbus-secret-service-keyring-store`
# on unix-non-mac, so an unconditional dependency would drag D-Bus/Secret Service
# into the Linux (web/Docker) and headless builds. Scoping the dependency to
# mac/windows keeps those builds free of any store crate at all — they use the
# file-0600 fallback in `account::token_store` (see that module), which is the
# only path that module compiles off-mac/windows anyway.
#
# Item addressing is unchanged from keyring 3, so tokens written by earlier
# releases stay readable: macOS = generic password in the User (login) keychain
# keyed on service+account; Windows = generic credential with target name
# `{user}.{service}`, UTF-16 blob, CRED_PERSIST_ENTERPRISE. The token is NEVER
# written to logs or DB.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1"] }

[features]
# `render` pulls the rustafits image pipeline; `solver` pulls the plate-solver.
# Default keeps today's full behavior for the desktop/web builds. Headless
# consumers build with `--no-default-features` to omit both native-heavy deps.
default = ["render", "solver"]
render = ["dep:rustafits"]
solver = ["dep:solvemyastro"]

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.27", default-features = false }
# Mock HTTP server for the account hub-client tests (task B4).
wiremock = "0.6"
