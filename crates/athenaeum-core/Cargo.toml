[package]
name = "athenaeum-core"
version = "0.2.3"
description = "Athenaeum core library - shared business logic for desktop and web"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
r2d2 = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
walkdir = "2"
anyhow = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
quick-xml = "0.36"
uuid = { version = "1", features = ["v4"] }
rustafits = { path = "../../rustafits", features = ["debug-pipeline"] }
# Standalone plate solver (clean-room quad-matching implementation). Path dep like
# rustafits; Phase 3 adapter calls solvemyastro::solve / build_cache.
solvemyastro = { path = "../../solvemyastro" }
sha2 = "0.10"
md-5 = "0.10"
jpeg-encode = { path = "../jpeg-encode" }
memmap2 = "0.9"
byteorder = "1"
cdshealpix = "0.9"
flate2 = "1.0"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
reqwest = { version = "0.12", features = ["blocking"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
ts-rs = { version = "10", features = ["chrono-impl"] }

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.25", default-features = false }
