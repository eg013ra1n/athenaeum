[package]
name = "athenaeum-core"
version = "0.2.0-beta.7"
description = "Athenaeum core library - shared business logic for desktop and web"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
r2d2 = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
walkdir = "2"
anyhow = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
quick-xml = "0.36"
uuid = { version = "1", features = ["v4"] }
rustafits = { path = "../../rustafits", features = ["debug-pipeline"] }
sha2 = "0.10"
base64 = "0.22"
jpeg-encode = { path = "../jpeg-encode" }
memmap2 = "0.9"
byteorder = "1"
cdshealpix = "0.7"
flate2 = "1.0"
reqwest = { version = "0.12", features = ["blocking"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.25", default-features = false }
