[package]
name = "starloom"
version = "0.1.0"
description = "The astrophotography stacking kernel: geometry, resampling, FITS/XISF writing, calibration, registration, integration and drizzle"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/eg013ra1n/starloom"

# Standalone manifest (SL-12): no [workspace] table and no `workspace = true` keys, so the crate
# publishes on its own. Versions and features below are copied from Athenaeum's core manifest. Dependencies
# resolve by version (SL-18): rustafits from crates.io, solvemyastro by git revision; Athenaeum's workspace
# [patch]es both back to its submodules, so it builds one copy of each.

[dependencies]
# `engine`: the image pipeline. `serde`: the `star_measure` / `stats` types a stacking config stores.
rustafits = { version = "1.9.1", default-features = false, features = ["serde"], optional = true }
# `stack`: the registration quad matcher.
solvemyastro = { git = "https://github.com/eg013ra1n/solvemyastro.git", rev = "586937fa972e6bfa53c316e49758ed70aa888388", optional = true }
# no-serde-warnings: ts-rs cannot parse type-irrelevant serde attrs and warns on every build.
ts-rs = { version = "12", features = ["chrono-impl", "no-serde-warnings"], optional = true }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` only (core's spec): never `preserve_order` or `arbitrary_precision`.
serde_json = { version = "1", features = ["float_roundtrip"] }
tracing = "0.1"
anyhow = "1"
rayon = "1.10"
byteorder = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
# The pass-1 artifact's wire encoding (the `stack` layer only).
postcard = { version = "1", features = ["use-std"], optional = true }

# The platform memory probe (`sys::platform_memory`): GlobalMemoryStatusEx and the job-object limits.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading"] }

[features]
default = ["stack", "ts"]
# Layer 2: needs the rustafits image pipeline (integration, light calibration, cosmetic correction).
engine = ["dep:rustafits"]
# Layer 3: registration, measurement, rejection, drizzle, weighting. Needs the quad matcher.
stack = ["engine", "dep:solvemyastro", "dep:postcard"]
# ts-rs derives (the TypeScript types the app generates).
ts = ["dep:ts-rs"]
# Test hooks and fixtures that tests in dependent crates read (SL-17); never in default. It forwards rustafits' hooks
# (`PlanePrep::zero_timings`) when the `engine` layer is on.
test-support = ["rustafits?/test-support"]

# The stage goldens hold for the build profile they were recorded under: Athenaeum's dev profile, opt-level 2 for
# starloom and rustafits. At opt-level 0 one measured FWHM comes out one ulp apart (measured 2026-11-23, starloom phase 3: the measure
# and pass-1 rows red, 7/7 at opt-level 2), so a standalone build uses the same level. Inside Athenaeum's workspace
# this section is ignored (cargo warns that a non-root package's profiles are ignored) and the root's profile applies.
[profile.dev]
opt-level = 2

[lints.rust]
unexpected_cfgs = "deny"

[dev-dependencies]
# The integration tests read the SL-17 test hooks. A path dev-dependency on the crate itself is allowed (publishing
# strips it).
starloom = { path = ".", default-features = false, features = ["test-support"] }
rustafits = { version = "1.9.1", default-features = false, features = ["serde", "test-support"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
walkdir = "2"
